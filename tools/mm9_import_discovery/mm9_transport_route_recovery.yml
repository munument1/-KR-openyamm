review_notes:
  - The route destinations and weekday availability for the seven Dock rows agree with source item 562,
    Boat Schedule. The DLL switch tables independently establish the travel-day values and runtime map strings.
  - DLL day indices 0 through 6 are Saturday through Friday for the original campaign epoch.
  - The DLL guards every route into Frosgard with its thawed-docks state. OpenYAMM represents that state with raw
    RUDE quest key 73, which also guards NPC 209's source service row.
  - NPC 138 is a reachable RUDE -5 special passage present in the executable switch but is not a Dock in
    MMIXSHOPS.txt. It remains classified separately and retains its RUDE forbidden-key condition.
