items:
  2:
    item_id: 10002
    name: Poor Sword
    asset: generated_item_art/mm9_item_10002.png
    generation_tool: built-in image_gen
    use_case: stylized-concept
    source_reference: assets_dev/worlds/mm9/icons/mm9_item_10002.png
    target_dimensions: [40, 160]
    prompt: |-
      Use case: stylized-concept
      Asset type: low-resolution fantasy RPG inventory item sprite for OpenYAMM
      Primary request: create a full-length inventory sprite of the MM9 Poor Sword shown in Image 1,
        redesigned for the tall MM6-MM8 inventory presentation shown in Image 2.
      Input images: Image 1 is the object-design reference; preserve its simple straight pale-steel blade,
        short dark grip, small gold crossguard, and modest inexpensive character. Image 2 is only the style,
        orientation, silhouette-scale, and late-1990s pre-rendered RPG reference.
      Subject: exactly one complete one-handed short sword, point at the top and pommel at the bottom,
        fully visible, centered, nearly vertical with only a very slight natural tilt.
      Style/medium: grounded late-1990s fantasy RPG inventory sprite, hand-painted pre-rendered realism,
        restrained detail, crisp readable silhouette, deliberately compatible with low-resolution downsampling;
        humble iron weapon, not ornate.
      Composition/framing: very tall narrow object with minimal empty margin; no border or icon frame.
      Lighting/mood: soft neutral upper-left studio light, modest metal highlight, restrained contrast.
      Constraints: genuinely transparent background and preserved alpha; exactly one sword; entire object visible;
        no text; no glow; no drop shadow; no pedestal; no border; no frame; no scenery; no hands; no watermark.
      Avoid: square icon composition, diagonal 45-degree pose, modern glossy mobile-game icon, exaggerated fantasy
        ornament, gemstones, magical effects, cropped blade or pommel.
    transparency_correction: |-
      Use case: background-extraction
      Primary request: remove the entire pale checkerboard background and replace it with genuine transparent alpha.
      Constraints: change only the background; preserve the complete sword; no checkerboard, halo, shadow, border,
        crop, new details, text, or watermark.
    postprocess: trim alpha bounds; fit within 40x160; center on transparent 40x160 canvas; low-radius unsharp
