name: One-shot hired learning bonus patcher

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/patch-hired-learning-bonus.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/party/Party.cpp

      - name: Connect hired Learning bonus to shared experience
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game/party/Party.cpp')
          text = path.read_text(encoding='utf-8')

          include_anchor = '#include "game/gameplay/GameMechanics.h"\n'
          include_line = '#include "game/gameplay/NpcFollowerRuntime.h"\n'
          if include_line not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit('GameMechanics include anchor did not match exactly once')
              text = text.replace(include_anchor, include_anchor + include_line, 1)

          setup_anchor = (
              '    const uint32_t experiencePerEligibleMember = totalExperience / eligibleMemberCount;\n'
              '    uint32_t totalGrantedExperience = 0;\n'
          )
          setup_replacement = (
              '    const uint32_t experiencePerEligibleMember = totalExperience / eligibleMemberCount;\n'
              '\n'
              '    EventRuntimeState followerRuntimeState = {};\n'
              '    applyGlobalNpcStateTo(followerRuntimeState);\n'
              '    const int followerLearningPercent =\n'
              '        std::max(0, hiredNpcSkillBonus(followerRuntimeState, "Learning"));\n'
              '\n'
              '    uint32_t totalGrantedExperience = 0;\n'
          )
          if 'followerLearningPercent' not in text:
              if text.count(setup_anchor) != 1:
                  raise SystemExit('shared-experience setup anchor did not match exactly once')
              text = text.replace(setup_anchor, setup_replacement, 1)

          learning_anchor = '        const int learningPercent = learningPercentForExperienceGain(member);\n'
          learning_replacement = (
              '        const int learningPercent =\n'
              '            learningPercentForExperienceGain(member) + followerLearningPercent;\n'
          )
          if learning_replacement not in text:
              if text.count(learning_anchor) != 1:
                  raise SystemExit('Learning percent anchor did not match exactly once')
              text = text.replace(learning_anchor, learning_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -n -A8 -B4 'followerLearningPercent' game/party/Party.cpp

      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/party/Party.cpp
          git commit -m "Apply hired NPC Learning bonus to experience"
          git push origin HEAD:korean-localization
