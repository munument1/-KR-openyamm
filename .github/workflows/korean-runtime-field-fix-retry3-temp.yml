name: Temporary final Korean runtime localization validation

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/korean-runtime-field-fix-retry3-temp.yml

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/checkout@v7
        with:
          repository: munument1/-KR-MMMerge
          ref: main
          path: _mmmerge
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Data/Text localization/**

      - name: Apply localization patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/korean-runtime-field-fix-temp.yml').read_text(encoding='utf-8')
          match = re.search(r"^\s*payload = ('[^']+')\s*$", workflow, re.MULTILINE)
          if match is None:
              raise SystemExit('patch payload missing')
          payload = ast.literal_eval(match.group(1))
          Path('/tmp/apply_runtime_fix.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/apply_runtime_fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('korean/tools/sync_map_target_names.py')
          text = path.read_text(encoding='utf-8')
          old = 'Untranslated house targetName values remain'
          new = 'Untranslated generated targetName values remain'
          if old not in text:
              raise SystemExit('generated target-name diagnostic not found')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python3 -m py_compile korean/tools/extend_map_runtime_catalog.py korean/tools/sync_map_target_names.py korean/tools/test_map_runtime_po.py korean/tools/test_sync_map_target_names.py korean/build_patch.py
          git diff --check

      - name: Test all Korean localization tools
        run: python3 -m unittest discover -s korean/tools -p 'test_*.py'

      - name: Build release overlay
        run: bash korean/build_release_overlay.sh _mmmerge dist/runtime-localization-fix

      - name: Verify reported runtime misses in final zips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('dist/runtime-localization-fix/korean')
          with zipfile.ZipFile(root / 'engine.zip') as archive:
              npc = archive.read('data_tables/npc_topic_text.txt').decode('utf-8-sig')
              maps = archive.read('data_tables/map_stats.txt').decode('utf-8-sig')
          assert '다데로스는 원팽 리자드맨 부족과 토버스크 열매를 거래하기 위해' in npc
          assert 'Dadeross led us here to trade with the Lizardman Clan of Onefang' not in npc
          assert '대거운드 섬' in maps

          with zipfile.ZipFile(root / 'worlds/mm8.zip') as archive:
              out01 = archive.read('events/maps/out01.lua').decode('utf-8')
          for expected in (
              '"우물물을 마십니다."',
              '"지능 +15 (일시적)"',
              '"상쾌합니다."',
              '"히스의 오두막"',
          ):
              assert expected in out01, expected
          assert '"Drink from the well"' not in out01
          assert '"Hiss\' Hut"' not in out01
          print('Final ZIP runtime checks passed')
          PY

      - name: Commit validated fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/AssetFileSystem.cpp tests/AssetFileSystemTests.cpp korean/build_patch.py korean/tools/extend_map_runtime_catalog.py korean/tools/sync_map_target_names.py korean/tools/test_map_runtime_po.py korean/tools/test_sync_map_target_names.py korean/translations/ko.po korean/.runtime-localization-validation-trigger
          git diff --cached --check
          git commit -m 'Route field runtime text through Korean PO'
          git push origin HEAD:korean-localization
