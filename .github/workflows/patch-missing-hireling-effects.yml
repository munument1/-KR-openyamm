name: One-shot missing hireling effect patcher

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/patch-missing-hireling-effects.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/gameplay/NpcFollowerRuntime.cpp

      - name: Apply source-data hireling effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game/gameplay/NpcFollowerRuntime.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''        else if (skillName == "Merchant")
                  {
                      if (professionId == 20) bonus += 4;
                      else if (professionId == 21) bonus += 6;
                  }
                  else if (skillName == "DisarmTraps")
                  {
                      if (professionId == 25) bonus += 4;
                      else if (professionId == 26) bonus += 6;
                  }
          '''
          new = '''        else if (skillName == "Merchant")
                  {
                      if (professionId == 20) bonus += 4;
                      else if (professionId == 21) bonus += 6;
                      else if (professionId == 48) bonus += 3;
                      else if (professionId == 49) bonus += 4;
                      else if (professionId == 50) bonus += 8;
                  }
                  else if (skillName == "DisarmTraps")
                  {
                      if (professionId == 25) bonus += 4;
                      else if (professionId == 26) bonus += 6;
                      else if (professionId == 51) bonus += 8;
                  }
          '''
          if old not in text:
              raise SystemExit('Merchant/Disarm hireling anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (follower.professionId == 27)
                  {
                      bonus += 10;
                  }
                  else if (follower.professionId == 28)
                  {
                      bonus += 20;
                  }
          '''
          new = '''        if (follower.professionId == 27)
                  {
                      bonus += 5;
                  }
                  else if (follower.professionId == 28)
                  {
                      bonus += 20;
                  }
                  else if (follower.professionId == 47)
                  {
                      bonus += 10;
                  }
          '''
          if old not in text:
              raise SystemExit('Luck hireling anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (follower.professionId == 29)
                  {
                      reduction += 1;
                  }
                  else if (follower.professionId == 30)
                  {
                      reduction += 2;
                  }
          '''
          new = '''        if (follower.professionId == 29 || follower.professionId == 48)
                  {
                      reduction += 1;
                  }
                  else if (follower.professionId == 30)
                  {
                      reduction += 2;
                  }
          '''
          if old not in text:
              raise SystemExit('rest-food hireling anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -n -A35 -B5 'skillName == "Merchant"' game/gameplay/NpcFollowerRuntime.cpp
          grep -n -A28 -B5 'statName != "Luck"' game/gameplay/NpcFollowerRuntime.cpp
          grep -n -A20 -B5 'hiredNpcRestFoodReduction' game/gameplay/NpcFollowerRuntime.cpp

      - name: Commit source-data hireling fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/gameplay/NpcFollowerRuntime.cpp
          git commit -m "Complete source-defined hireling bonuses"
          git push origin HEAD:korean-localization
