name: One-shot r9 runtime localization hotfix

on:
  push:
    branches: [korean-localization]
    paths: [".github/workflows/apply-r9-runtime-hotfix.yml"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply r9 runtime localization hotfix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
      - name: Patch runtime localization routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if new in s:
                  print(label, "already applied")
                  return
              if old not in s:
                  raise SystemExit(f"{label}: anchor not found")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print(label, "applied")

          # Status-bar events: dynamic event/stat messages already have Korean overrides;
          # make the display boundary actually use them.
          p = Path("game/gameplay/GameplayScreenRuntime.cpp")
          s = p.read_text(encoding="utf-8")
          inc = '#include "game/ui/KoreanRuntimeTextOverrides.h"\n'
          anchor = '#include "game/ui/GameplayJournalMapUi.h"\n'
          if inc not in s:
              if anchor not in s: raise SystemExit("status include anchor missing")
              s = s.replace(anchor, anchor + inc, 1)
          old = '''void GameplayScreenRuntime::setStatusBarEvent(
              const std::string &text,
              float durationSeconds,
              GameplayUiController::StatusBarEventPriority priority)
          {
              uiController().setStatusBarEvent(text, durationSeconds, priority);
          }
          '''
          new = '''void GameplayScreenRuntime::setStatusBarEvent(
              const std::string &text,
              float durationSeconds,
              GameplayUiController::StatusBarEventPriority priority)
          {
              const std::string localizedText =
                  KoreanRuntimeText::koreanRuntimeTextOverride(text).value_or(text);
              uiController().setStatusBarEvent(localizedText, durationSeconds, priority);
          }
          '''
          if new not in s:
              if old not in s: raise SystemExit("setStatusBarEvent anchor missing")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # Event-target labels/hovers: do not restrict localization to Decoration targets.
          p = Path("game/gameplay/GameplayInteractionController.cpp")
          s = p.read_text(encoding="utf-8")
          inc = '#include "game/ui/KoreanRuntimeTextOverrides.h"\n'
          anchor = '#include "game/ui/KoreanDecorationText.h"\n'
          if inc not in s:
              if anchor not in s: raise SystemExit("interaction include anchor missing")
              s = s.replace(anchor, anchor + inc, 1)
          helper = '''std::string localizeInteractionDisplayText(const std::string &text)
          {
              if (const std::optional<std::string> localized =
                      KoreanRuntimeText::koreanRuntimeTextOverride(text))
              {
                  return *localized;
              }
              return KoreanRuntimeText::koreanDecorationHint(text);
          }

          '''
          hanchor = '''bool hasStatusText(const std::optional<std::string> &text)
          {
              return text.has_value() && !text->empty();
          }

          '''
          if helper not in s:
              if hanchor not in s: raise SystemExit("interaction helper anchor missing")
              s = s.replace(hanchor, hanchor + helper, 1)
          old_hover = '''    if (targetKind == GameplayWorldEventTargetKind::Decoration)
              {
                  return KoreanRuntimeText::koreanDecorationHint(*payload.eventTargetStatusText);
              }

              return payload.eventTargetStatusText;
          '''
          new_hover = '''    return localizeInteractionDisplayText(*payload.eventTargetStatusText);
          '''
          if new_hover not in s:
              if old_hover not in s: raise SystemExit("hover anchor missing")
              s = s.replace(old_hover, new_hover, 1)
          guard = '''    if (hit.kind == GameplayWorldHitKind::EventTarget && !action.label.empty())
              {
                  action.label = localizeInteractionDisplayText(action.label);
              }

          '''
          a = '''    if (action.iconId.empty())
              {
                  action.iconId = contextActionIconId(action.kind);
              }
          '''
          if guard not in s:
              if a not in s: raise SystemExit("action label anchor missing")
              s = s.replace(a, guard + a, 1)
          p.write_text(s, encoding="utf-8")

          # Common interactive nouns.
          p = Path("game/ui/KoreanDecorationText.h")
          s = p.read_text(encoding="utf-8")
          if '{"well", "우물"}' not in s:
              a = '        {"fountain", "분수"},\n'
              n = a + '        {"well", "우물"},\n        {"anvil", "모루"},\n        {"shrine", "성소"},\n        {"obelisk", "오벨리스크"},\n        {"sign", "표지판"},\n'
              if a not in s: raise SystemExit("decoration anchor missing")
              s = s.replace(a, n, 1)
          p.write_text(s, encoding="utf-8")

          # Parchment journal body: black text should not draw the black shadow layer.
          p = Path("game/ui/GameplayPartyOverlayRenderer.cpp")
          s = p.read_text(encoding="utf-8")
          old_sig = '''void renderHudLines(
              const GameplayScreenRuntime &context,
              const auto &font,
              uint32_t colorAbgr,
              const std::vector<std::string> &lines,
              float x,
              float y,
              float fontScale)
          '''
          new_sig = '''void renderHudLines(
              const GameplayScreenRuntime &context,
              const auto &font,
              uint32_t colorAbgr,
              const std::vector<std::string> &lines,
              float x,
              float y,
              float fontScale,
              bool drawShadow = true)
          '''
          if new_sig not in s:
              if old_sig not in s: raise SystemExit("renderHudLines signature anchor missing")
              s = s.replace(old_sig, new_sig, 1)
          shadow = '        context.renderHudFontLayer(font, font.shadowTextureHandle, lines[index], x, lineY, fontScale);\n'
          guarded = '        if (drawShadow)\n        {\n            context.renderHudFontLayer(font, font.shadowTextureHandle, lines[index], x, lineY, fontScale);\n        }\n'
          if guarded not in s:
              if shadow not in s: raise SystemExit("renderHudLines shadow anchor missing")
              s = s.replace(shadow, guarded, 1)
          call = '            renderHudLines(context, *bodyFont, pTextLayout->textColorAbgr, bodyLines, textResolved->x, textResolved->y, bodyFontScale);\n'
          no_shadow_call = '            renderHudLines(context, *bodyFont, pTextLayout->textColorAbgr, bodyLines, textResolved->x, textResolved->y, bodyFontScale, false);\n'
          if no_shadow_call not in s:
              if call not in s: raise SystemExit("journal body call anchor missing")
              s = s.replace(call, no_shadow_call, 1)
          p.write_text(s, encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/gameplay/GameplayScreenRuntime.cpp game/gameplay/GameplayInteractionController.cpp game/ui/KoreanDecorationText.h game/ui/GameplayPartyOverlayRenderer.cpp
          git commit -m "fix(korean): localize runtime interactions and journal text"
          git push origin HEAD:korean-localization
