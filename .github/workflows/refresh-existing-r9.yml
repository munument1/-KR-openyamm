name: Refresh existing Korean r9 release

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/refresh-existing-r9.yml

permissions:
  actions: write
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Build current Korean packages without publishing nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run nightly.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref korean-localization \
            -f publish_release=false
