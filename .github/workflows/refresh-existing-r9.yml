name: Refresh existing Korean r9 release

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/refresh-existing-r9.yml

permissions:
  actions: write
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Replace existing 0.11-korean-r9 release from its tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="0.11-korean-r9"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          gh workflow run nightly.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f publish_release=true
