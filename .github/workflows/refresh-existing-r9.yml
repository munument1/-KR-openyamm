name: Refresh existing Korean r9 release

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/refresh-existing-r9.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Restore 0.11-korean-r9 from original successful artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="0.11-korean-r9"
          RUN_ID="34297915766"
          rm -rf downloads release-assets
          mkdir -p downloads release-assets
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloads
          find downloads -type f \( \
            -name 'OpenYAMM-0.11-korean-r9-android-arm64.apk' -o \
            -name 'OpenYAMM-0.11-korean-r9-android-arm64.apk.sha256' -o \
            -name 'OpenYAMM-0.11-korean-r9-windows-x64.zip' -o \
            -name 'OpenYAMM-0.11-korean-r9-windows-x64.zip.sha256' -o \
            -name 'OpenYAMM-0.11-korean-r9-x86_64.flatpak' -o \
            -name 'OpenYAMM-0.11-korean-r9-x86_64.flatpak.sha256' \
          \) -exec cp '{}' release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "OpenYAMM $TAG" \
              --generate-notes
          fi
