name: Temporary object and sign display audit
on:
  push:
    branches: [tmp-record-hover-fixes]
    paths: [".github/workflows/tmp-object-sign-audit.yml"]
permissions:
  contents: write
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit object and sign display strings'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-record-hover-fixes
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets_dev/worlds/mm6/events/maps/**
            /assets_dev/worlds/mm7/events/maps/**
            /assets_dev/worlds/mm8/events/maps/**
            /assets_dev/worlds/mmmerge/events/maps/**
            /assets_dev/engine/data_tables/decoration_data.txt
            /korean/**
            /game/ui/KoreanDecorationText.h
            /game/gameplay/GameplayInteractionController.cpp
      - name: Collect object and sign strings
        shell: bash
        run: |
          set -euo pipefail
          out=korean/translations/tmp_object_sign_audit.txt
          : > "$out"
          echo '== OBJECT LITERALS ==' >> "$out"
          grep -RInEi --include='*.lua' 'keg|anvil|sign|signpost|marker|building|house|temple|guild|tavern|inn' assets_dev/worlds/*/events/maps | head -n 2500 >> "$out" || true
          echo '== TARGET NAMES LATIN ==' >> "$out"
          python3 - <<'PY' >> "$out"
          import re
          from pathlib import Path
          pat=re.compile(r'targetName\s*=\s*"((?:\\.|[^"\\])*)"')
          rows=[]
          for p in sorted(Path('assets_dev/worlds').glob('*/events/maps/*.lua')):
              t=p.read_text(encoding='utf-8',errors='ignore')
              for m in pat.finditer(t):
                  if re.search(r'[A-Za-z]',m.group(1)):
                      rows.append((str(p),m.group(1)))
          print('latin_target_names',len(rows))
          for row in rows[:1200]: print(*row,sep='\t')
          PY
          echo '== RUNTIME LOCALIZER ==' >> "$out"
          grep -nEi 'keg|anvil|sign|koreanDecorationHint|resolveHoverStatusText|localizeInteractionDisplayText' game/ui/KoreanDecorationText.h game/gameplay/GameplayInteractionController.cpp >> "$out" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'Record object and sign display audit'
          git push origin HEAD:tmp-record-hover-fixes
