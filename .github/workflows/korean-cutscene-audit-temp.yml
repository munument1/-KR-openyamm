name: Temporary Korean cutscene source audit

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-cutscene-audit-temp.yml"
      - "korean/tools/build_cutscene_subtitle_inventory.py"
      - "korean/tools/test_cutscene_subtitle_inventory.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-cutscenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Korean branch with source movies
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1

      - name: Install media and speech probe tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir faster-whisper

      - name: Test cutscene inventory tooling
        run: python3 -m unittest korean/tools/test_cutscene_subtitle_inventory.py

      - name: Build runtime/source cutscene inventory
        run: python3 korean/tools/build_cutscene_subtitle_inventory.py

      - name: Probe runtime OGV and legacy BIK media
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          root = Path('.')
          inventory = json.loads((root / 'korean/subtitles/source_inventory.json').read_text(encoding='utf-8'))

          def probe(path, metadata):
              command = [
                  'ffprobe', '-v', 'error', '-show_entries',
                  'format=duration:stream=index,codec_type,codec_name,duration',
                  '-of', 'json', str(path),
              ]
              result = subprocess.run(command, check=False, capture_output=True, text=True)
              record = dict(metadata)
              record['path'] = path.as_posix()
              record['returncode'] = result.returncode
              record['stderr'] = result.stderr.strip()
              if result.returncode == 0:
                  payload = json.loads(result.stdout)
                  record['duration_seconds'] = float(payload.get('format', {}).get('duration', 0) or 0)
                  record['streams'] = payload.get('streams', [])
                  record['has_audio'] = any(stream.get('codec_type') == 'audio' for stream in record['streams'])
                  record['has_video'] = any(stream.get('codec_type') == 'video' for stream in record['streams'])
              return record

          runtime_probes = [
              probe(root / entry['path'], {
                  'world': entry['world'],
                  'stem': entry['stem'],
                  'referenced': entry['referenced'],
              })
              for entry in inventory.get('runtime_videos', [])
          ]
          legacy_bik_probes = [
              probe(root / entry['source_path'], {
                  'stem': entry['stem'],
                  'source_path': entry['source_path'],
              })
              for entry in inventory['entries']
              if entry['extension'] == '.bik'
          ]

          output = root / 'korean/subtitles/media_probe.json'
          output.write_text(
              json.dumps(
                  {'format': 2, 'runtime_ogv': runtime_probes, 'legacy_bik': legacy_bik_probes},
                  ensure_ascii=False,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          print(f'PROBED_RUNTIME_OGV={len(runtime_probes)}')
          print(f'PROBED_LEGACY_BIK={len(legacy_bik_probes)}')
          for record in runtime_probes:
              print(
                  record['world'], record['stem'],
                  'duration=', record.get('duration_seconds'),
                  'audio=', record.get('has_audio'),
                  'referenced=', record['referenced'],
                  'rc=', record['returncode'],
              )
          PY

      - name: Generate timestamped English ASR audit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          root = Path('.')
          probe = json.loads((root / 'korean/subtitles/media_probe.json').read_text(encoding='utf-8'))
          model = WhisperModel('base.en', device='cpu', compute_type='int8')
          records = []
          for media in probe['runtime_ogv']:
              record = {
                  'world': media['world'],
                  'stem': media['stem'],
                  'path': media['path'],
                  'duration_seconds': media.get('duration_seconds'),
                  'has_audio': media.get('has_audio', False),
                  'note': 'Machine ASR audit only; verify against game media/text before subtitle authoring.',
                  'segments': [],
              }
              if media.get('has_audio'):
                  segments, info = model.transcribe(
                      str(root / media['path']),
                      language='en',
                      beam_size=5,
                      vad_filter=True,
                      condition_on_previous_text=False,
                      word_timestamps=True,
                  )
                  record['language'] = info.language
                  record['language_probability'] = info.language_probability
                  for segment in segments:
                      words = []
                      for word in segment.words or []:
                          words.append({
                              'start': round(float(word.start), 3),
                              'end': round(float(word.end), 3),
                              'text': word.word,
                              'probability': round(float(word.probability), 4),
                          })
                      record['segments'].append({
                          'start': round(float(segment.start), 3),
                          'end': round(float(segment.end), 3),
                          'text': segment.text.strip(),
                          'avg_logprob': round(float(segment.avg_logprob), 4),
                          'no_speech_prob': round(float(segment.no_speech_prob), 4),
                          'words': words,
                      })
              records.append(record)
              print(media['world'], media['stem'], 'segments=', len(record['segments']))

          output = root / 'korean/subtitles/asr_draft.json'
          output.write_text(
              json.dumps({'format': 1, 'model': 'faster-whisper base.en', 'records': records}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'ASR_RECORDS={len(records)}')
          PY

      - name: Commit generated audit data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korean/subtitles/source_inventory.json korean/subtitles/media_probe.json korean/subtitles/asr_draft.json
          if git diff --cached --quiet; then
            echo "Audit data already current."
            exit 0
          fi
          git commit -m "Refresh cutscene speech audit [skip ci]"
          git push origin HEAD:korean-localization

      - name: Upload cutscene audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: korean-cutscene-source-audit
          path: |
            korean/subtitles/source_inventory.json
            korean/subtitles/media_probe.json
            korean/subtitles/asr_draft.json
          if-no-files-found: error
          retention-days: 7
