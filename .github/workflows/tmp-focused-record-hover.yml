name: Temporary focused record and hover audit
on:
  push:
    branches: [tmp-record-hover-fixes]
    paths: [".github/workflows/tmp-focused-record-hover.yml"]
permissions:
  contents: write
jobs:
  audit:
    if: github.event.head_commit.message == 'Collect focused record and hover audit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-record-hover-fixes
          fetch-depth: 1
      - name: Collect concise report
        shell: bash
        run: |
          set -euo pipefail
          out=korean/translations/tmp_record_hover_audit.txt
          : > "$out"
          echo '== FILE NAMES ==' >> "$out"
          find game/ui game/gameplay game/outdoor -type f | grep -Ei 'book|quest|history|journal|autonote|award|hover|status|interaction' | head -n 200 >> "$out" || true
          echo '== RECORD SYMBOLS ==' >> "$out"
          grep -RInE --include='*.cpp' --include='*.h' 'GUIWindow_(Quest|Autonote|History|Award)|QuestBook|Autonote|HistoryBook|Journal|Awards|useShadow' game/ui game/gameplay | head -n 500 >> "$out" || true
          echo '== HOVER SYMBOLS ==' >> "$out"
          grep -RInE --include='*.cpp' --include='*.h' 'updateHover|hoverStatus|statusText|eventTargetStatusText|displayName|targetName|koreanDecorationHint|localizeInteractionDisplayText' game/gameplay game/outdoor game/ui | head -n 700 >> "$out" || true
          echo '== DECORATION COVERAGE ==' >> "$out"
          python3 - <<'PY' >> "$out"
          import csv,json
          from pathlib import Path
          rows=list(csv.reader(Path('assets_dev/engine/data_tables/decoration_data.txt').read_text(encoding='utf-8-sig').splitlines(),delimiter='\t'))
          p=json.loads(Path('korean/translations/decoration_hints.json').read_text(encoding='utf-8'))
          entries={str(k).strip().casefold():v for k,v in p.get('entries',{}).items()}
          excluded={str(x).strip().casefold() for x in p.get('excluded_sources',[])}
          hints=sorted({r[2].strip() for r in rows if len(r)>2 and r[0].strip().isdigit() and r[2].strip()}, key=str.casefold)
          unknown=[x for x in hints if x.casefold() not in entries and x.casefold() not in excluded]
          print('unique_hints',len(hints),'mapped',len(entries),'excluded',len(excluded),'unknown',len(unknown))
          for x in unknown: print('UNKNOWN',repr(x))
          for x in ['keg','anvil','tree','rock','flowers','flower','sign']:
              print('MAP',x,repr(entries.get(x)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'Record focused record and hover audit'
          git push origin HEAD:tmp-record-hover-fixes
