name: Korean clean UTF-8 name input

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/korean-clean-name-input.yml

permissions:
  contents: write

jobs:
  clean-name-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 0

      - name: Remove temporary UTF-8 workaround
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header_path = Path('game/ui/screens/NewGameScreen.h')
          header = header_path.read_text(encoding='utf-8')

          header = header.replace('#include "game/ui/Utf8Text.h"\n', '')
          header = header.replace('#include <cctype>\n', '')
          header = header.replace('#include <string_view>\n', '')

          workaround = '''#if defined(OPENYAMM_UTF8_NEW_GAME_NAMES)
          namespace std
          {
          inline int isalnum(unsigned char character)
          {
              return ::isalnum(static_cast<int>(character)) != 0 || character >= 0x80u;
          }
          }
          #endif

          '''
          if workaround not in header:
              raise SystemExit('Expected namespace std UTF-8 workaround was not found')
          header = header.replace(workaround, '', 1)

          buffer_class = '''class Utf8NameEditBuffer : public std::string
          {
          public:
              using std::string::string;
              using std::string::operator=;

              size_t size() const noexcept
              {
                  const std::string_view text(data(), std::string::size());
                  size_t count = 0;
                  size_t byteOffset = 0;

                  while (byteOffset < text.size())
                  {
                      const Utf8CodePointSpan span = decodeUtf8CodePoint(text, byteOffset);
                      if (!span.valid || span.byteLength == 0)
                      {
                          break;
                      }

                      ++count;
                      byteOffset += span.byteLength;
                  }

                  return count;
              }

              void pop_back()
              {
                  if (std::string::empty())
                  {
                      return;
                  }

                  const std::string_view text(data(), std::string::size());
                  std::string::resize(previousUtf8CodePointOffset(text, text.size()));
              }
          };

          '''
          if buffer_class not in header:
              raise SystemExit('Expected Utf8NameEditBuffer workaround was not found')
          header = header.replace(buffer_class, '', 1)
          if 'Utf8NameEditBuffer nameEditBuffer;' not in header:
              raise SystemExit('Expected custom name buffer field was not found')
          header = header.replace('Utf8NameEditBuffer nameEditBuffer;', 'std::string nameEditBuffer;', 1)
          header_path.write_text(header, encoding='utf-8')

          cmake_path = Path('game/CMakeLists.txt')
          cmake = cmake_path.read_text(encoding='utf-8')
          cmake_workaround = '''set_property(
              SOURCE ui/screens/NewGameScreen.cpp
              APPEND
              PROPERTY COMPILE_DEFINITIONS
                  OPENYAMM_UTF8_NEW_GAME_NAMES
          )

          '''
          if cmake_workaround not in cmake:
              raise SystemExit('Expected CMake UTF-8 workaround was not found')
          cmake = cmake.replace(cmake_workaround, '', 1)
          cmake_path.write_text(cmake, encoding='utf-8')

          source = Path('game/ui/screens/NewGameScreen.cpp').read_text(encoding='utf-8')
          required = (
              'utf8CodePointCount(m_state.nameEditBuffer)',
              'isPrintableNameCodePoint(span.codePoint)',
              'previousUtf8CodePointOffset(m_state.nameEditBuffer, m_state.nameEditBuffer.size())',
          )
          missing = [needle for needle in required if needle not in source]
          if missing:
              raise SystemExit(f'Native UTF-8 name editing implementation is incomplete: {missing}')

          if 'OPENYAMM_UTF8_NEW_GAME_NAMES' in header or 'Utf8NameEditBuffer' in header:
              raise SystemExit('Temporary header workaround remains after cleanup')
          if 'OPENYAMM_UTF8_NEW_GAME_NAMES' in cmake:
              raise SystemExit('Temporary CMake workaround remains after cleanup')
          PY
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ui/screens/NewGameScreen.h game/CMakeLists.txt
          git commit -m "refactor(korean): use native UTF-8 name editing"
          git push origin HEAD:korean-localization
