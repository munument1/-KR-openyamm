name: Korean runtime display audit

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/korean-runtime-display-audit.yml
      - korean/tools/audit_runtime_display_text.py
      - korean/tools/test_runtime_display_audit.py
      - korean/tools/check_runtime_localization_routes.py
      - game/ui/KoreanRuntimeTextOverrides.h
      - game/ui/GameplayPartyOverlayRenderer.cpp
      - game/ui/GameplayHudCommon.cpp
      - game/ui/GameplayUiRuntime.cpp
      - game/gameplay/GameplayScreenRuntime.cpp
      - game/ui/GameplayDialogueRenderer.cpp
      - game/ui/screens/ArcomageScreen.cpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/**
            /korean/tools/audit_runtime_display_text.py
            /korean/tools/test_runtime_display_audit.py
            /korean/tools/check_runtime_localization_routes.py

      - name: Verify Korean runtime localization routes
        shell: bash
        run: |
          set -euo pipefail
          python3 korean/tools/check_runtime_localization_routes.py

      - name: Test runtime display audit heuristics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest korean/tools/test_runtime_display_audit.py

      - name: Scan runtime display literals
        shell: bash
        run: |
          set -euo pipefail
          python3 korean/tools/audit_runtime_display_text.py

      - name: Upload runtime display audit
        uses: actions/upload-artifact@v7
        with:
          name: korean-runtime-display-audit
          path: |
            runtime-display-audit.json
            runtime-display-audit.tsv
          retention-days: 7
