name: One-shot patch Korean runtime leaks

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/patch-korean-runtime-leaks.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot Korean runtime leak patcher'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch target
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/ui/KoreanRuntimeTextOverrides.h

      - name: Patch remaining runtime display leaks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game/ui/KoreanRuntimeTextOverrides.h')
          text = path.read_text(encoding='utf-8')

          bad = '''    if (text.find(" needs ") != std::string::npos
              && text.find(" more experience to train to level ") != std::string::npos
              && endsWith(text, "."))
          {
              const std::string needsMarker = " needs ";
              const std::string levelMarker = " more experience to train to level ";
              const size_t needs = text.find(needsMarker);
              const size_t level = text.find(levelMarker, needs + needsMarker.size());
              if (needs != std::string::npos && level != std::string::npos)
              {
                  const std::string subject = text.substr(0, needs);
                  const std::string experience = text.substr(
                      needs + needsMarker.size(),
                      level - (needs + needsMarker.size()));
                  const std::string targetLevel = text.substr(
                      level + levelMarker.size(),
                      text.size() - (level + levelMarker.size()) - 1);
                  return (subject == "This character" ? std::string("이 캐릭터") : subject)
                      + ": 레벨 " + targetLevel + " 훈련까지 경험치 " + experience + "이 더 필요합니다.";
              }
          }
          if (text.find(" is eligible to train up to level ") != std::string::npos && endsWith(text, "."))
          {
              const std::string levelMarker = " is eligible to train up to level ";
              const size_t split = text.find(levelMarker);
              if (split != std::string::npos)
              {
                  const std::string subject = text.substr(0, split);
                  const std::string targetLevel = text.substr(
                      split + levelMarker.size(),
                      text.size() - (split + levelMarker.size()) - 1);
                  return (subject == "This character" ? std::string("이 캐릭터") : subject)
                      + ": 레벨 " + targetLevel + "까지 훈련할 수 있습니다.";
              }
          }
          '''
          # The first patch committed this block with shallow indentation. Normalize
          # it without changing behavior. Generate the expected current form too.
          current = bad.replace('\n              &&', '\n    &&').replace('\n          {', '\n{').replace('\n              const', '\n    const').replace('\n              if', '\n    if').replace('\n              {', '\n    {').replace('\n                  const', '\n        const').replace('\n                  return', '\n        return').replace('\n                      ', '\n            ').replace('\n              }', '\n    }').replace('\n          }', '\n}')
          if current in text:
              text = text.replace(current, bad, 1)
          elif bad not in text:
              raise SystemExit('experience block not found for formatting check')

          marker = '    if (startsWith(text, "House #")) return "건물 #" + text.substr(7);\n'
          if text.count(marker) != 1:
              raise SystemExit(f'runtime status insertion marker count={text.count(marker)}')
          rules = '''    if (text == "Ooops") return "이런!";
          if (startsWith(text, "Deposited ") && endsWith(text, " gold."))
              return "입금: " + between(text, "Deposited ", " gold.") + "골드.";
          if (startsWith(text, "Withdrew ") && endsWith(text, " gold."))
              return "출금: " + between(text, "Withdrew ", " gold.") + "골드.";
          if (startsWith(text, "Answer: ")) return "답변: " + text.substr(8);
          '''
          if 'if (text == "Ooops")' not in text:
              text = text.replace(marker, rules + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'if (text == "Ooops") return "이런!";' game/ui/KoreanRuntimeTextOverrides.h
          grep -Fq 'startsWith(text, "Deposited ")' game/ui/KoreanRuntimeTextOverrides.h
          grep -Fq 'startsWith(text, "Withdrew ")' game/ui/KoreanRuntimeTextOverrides.h
          grep -Fq 'startsWith(text, "Answer: ")' game/ui/KoreanRuntimeTextOverrides.h
          git diff --check

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ui/KoreanRuntimeTextOverrides.h
          git commit -m "Cover remaining Korean runtime status text"
          git push origin HEAD:korean-localization
