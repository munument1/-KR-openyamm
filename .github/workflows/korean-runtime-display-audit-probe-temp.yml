name: Temporary Korean runtime display audit fix

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-runtime-display-audit-probe-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify-player-sink-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out latest Korean branch
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1

      - name: Apply structural sink patch
        run: python3 .github/temp_runtime_display_fix.py

      - name: Run regression tests
        run: python3 -m unittest korean/tools/test_runtime_display_audit.py

      - name: Run patched runtime display audit
        run: python3 korean/tools/audit_runtime_display_text.py

      - name: Verify layout keys are not high-confidence sinks
        run: python3 -c "import json; r=json.load(open('runtime-display-audit.json', encoding='utf-8')); bad=[x for x in r['rows'] if x['confidence']=='high' and x['literal'] in {'DialogueGoodbyeButton','DialogueEventDialog','DialogueHouseTitle'}]; print('HIGH_UNCOVERED_OCCURRENCES='+str(r['high_confidence_uncovered_occurrences'])); print('HIGH_UNIQUE_LITERALS='+str(r['high_confidence_unique_literals'])); assert r['format']==7; assert not bad, bad"

      - name: Commit verified audit source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korean/tools/audit_runtime_display_text.py korean/tools/test_runtime_display_audit.py
          git diff --cached --check
          git commit -m "Use structural runtime display sink detection"
          git push origin HEAD:korean-localization

      - name: Upload verified audit output
        uses: actions/upload-artifact@v7
        with:
          name: korean-runtime-display-audit-fixed
          path: |
            runtime-display-audit.json
            runtime-display-audit.tsv
          if-no-files-found: error
          retention-days: 7
