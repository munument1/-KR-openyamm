name: One-shot continent game label patcher

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/patch-continent-game-labels.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/ui/screens/NewGameScreen.cpp
      - name: Add M&M game labels to continent globes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game/ui/screens/NewGameScreen.cpp')
          text = path.read_text(encoding='utf-8')
          start = text.find('    const ButtonState enrothState = drawEllipseButton(')
          if start < 0:
              raise SystemExit('enroth button block not found')
          marker = '\n    if (jadameState.clicked)\n'
          insertion_at = text.find(marker, start)
          if insertion_at < 0:
              raise SystemExit('continent click marker not found')
          if 'drawContinentGameLabel(jadameRect, "M&M 8")' in text:
              raise SystemExit('continent game labels already exist')
          block = '''

    const auto drawContinentGameLabel =
        [this, scale](const MenuScreenBase::Rect &continentRect, const char *pLabel)
        {
            const float labelWidth = measureTextWidth("SMALLNUM", pLabel, scale);
            const float labelX = continentRect.x + (continentRect.width - labelWidth) * 0.5f;
            const float labelY = continentRect.y + continentRect.height - 36.0f * scale;
            drawText("SMALLNUM", pLabel, labelX, labelY, WhiteColor, scale);
        };
    drawContinentGameLabel(jadameRect, "M&M 8");
    drawContinentGameLabel(antagarichRect, "M&M 7");
    drawContinentGameLabel(enrothRect, "M&M 6");
'''
          path.write_text(text[:insertion_at] + block + text[insertion_at:], encoding='utf-8')
          PY
          git diff --check
      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ui/screens/NewGameScreen.cpp
          git commit -m "Label new game continents by Might and Magic game"
          git push origin HEAD:korean-localization
