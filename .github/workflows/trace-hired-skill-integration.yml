name: One-shot hired skill integration trace

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/trace-hired-skill-integration.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/**
      - name: Trace skill integration paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== hiredNpcSkillBonus references ==='
          grep -RIn 'hiredNpcSkillBonus' game || true
          echo '=== partyWideUtilitySkillScore references ==='
          grep -RIn 'partyWideUtilitySkillScore' game || true
          echo '=== Perception resolver references ==='
          grep -RIn 'resolveCharacterPerceptionValue' game || true
          echo '=== Disarm resolver references ==='
          grep -RIn 'resolveCharacterDisarmTrapValue' game || true
          echo '=== Merchant references in gameplay code ==='
          grep -RIn -E 'Merchant|merchantBonus|merchantScore' game | head -n 300 || true
          echo '=== follower lifecycle line numbers ==='
          grep -n -E 'Party::(restoreSnapshot|applyEventRuntimeState|addHiredNpcFollower|removeHiredNpcFollower)' game/party/Party.cpp || true
          echo '=== follower lifecycle context ==='
          python3 - <<'PY'
          from pathlib import Path
          text = Path('game/party/Party.cpp').read_text(encoding='utf-8').splitlines()
          needles = [
              'void Party::restoreSnapshot',
              'void Party::applyEventRuntimeState',
              'void Party::addHiredNpcFollower',
              'void Party::removeHiredNpcFollower',
          ]
          for needle in needles:
              for i, line in enumerate(text):
                  if needle in line:
                      lo = max(0, i - 5)
                      hi = min(len(text), i + 130)
                      print(f'--- {needle} @ {i+1} ---')
                      for n in range(lo, hi):
                          print(f'{n+1}:{text[n]}')
                      break
          PY
