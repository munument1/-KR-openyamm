name: One-shot deep review runtime terminology patcher

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/patch-deep-review-runtime-terms.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /korean/translations/stats_skills_reviewed.json
            /game/ui/GameplayHudCommon.cpp
            /game/ui/KoreanRuntimeTextOverrides.h

      - name: Standardize reviewed runtime terminology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          reviewed = Path('korean/translations/stats_skills_reviewed.json')
          text = reviewed.read_text(encoding='utf-8')
          replacements = (
              ('대기 저항', '공기 저항'),
              ('대기 기반', '공기 기반'),
              ('대기 마법', '공기 마법'),
              ('화염/대지/대기/물', '화염/대지/공기/물'),
              ('신체 저항', '육체 저항'),
              ('신체 기반', '육체 기반'),
              ('신체 마법', '육체 마법'),
              ('신체 피해', '육체 피해'),
              ('장착한 활로', '장착한 원거리 무기로'),
              ('물건을 사거나 팔 때', '아이템을 사거나 팔 때'),
          )
          for old, new in replacements:
              text = text.replace(old, new)
          reviewed.write_text(text, encoding='utf-8')

          for filename in (
              'game/ui/GameplayHudCommon.cpp',
              'game/ui/KoreanRuntimeTextOverrides.h',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('{"Air Magic", "대기 마법"}', '{"Air Magic", "공기 마법"}')
              text = text.replace('{"Body Magic", "신체 마법"}', '{"Body Magic", "육체 마법"}')
              path.write_text(text, encoding='utf-8')
          PY

          python3 -m json.tool korean/translations/stats_skills_reviewed.json >/dev/null
          grep -Fq '"Air Magic", "공기 마법"' game/ui/GameplayHudCommon.cpp
          grep -Fq '"Body Magic", "육체 마법"' game/ui/GameplayHudCommon.cpp
          grep -Fq '"Air Magic", "공기 마법"' game/ui/KoreanRuntimeTextOverrides.h
          grep -Fq '"Body Magic", "육체 마법"' game/ui/KoreanRuntimeTextOverrides.h
          grep -Fq '장착한 원거리 무기로' korean/translations/stats_skills_reviewed.json
          git diff --check

      - name: Commit terminology update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            korean/translations/stats_skills_reviewed.json \
            game/ui/GameplayHudCommon.cpp \
            game/ui/KoreanRuntimeTextOverrides.h
          git commit -m "Standardize Korean runtime terminology"
          git push origin HEAD:korean-localization
