name: Patch confirmed Korean visible UI residuals

on:
  push:
    branches: [korean-localization]
    paths:
      - .github/workflows/korean-visible-ui-residuals.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization
          fetch-depth: 0
          sparse-checkout: |
            game/ui/GameplayHudOverlaySupport.cpp
            game/ui/GameplayPartyOverlayRenderer.cpp
            game/outdoor/OutdoorGameView.cpp
          sparse-checkout-cone-mode: false

      - name: Patch display-only residuals
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(text, old, new, label, expected=1):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          # HUD inspect/buff overlays: all strings below are display-only.
          path = Path('game/ui/GameplayHudOverlaySupport.cpp')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('"Recovery time: " + std::to_string(recoveryTicksFromSeconds(recoverySeconds))', '"회복 시간: " + std::to_string(recoveryTicksFromSeconds(recoverySeconds))', 'melee recovery'),
              ('"Recovery time: N/A"', '"회복 시간: 해당 없음"', 'no ranged recovery'),
              ('"Recovery time: " + std::to_string(recoveryTicksFromSeconds(profile.rangedRecoverySeconds))', '"회복 시간: " + std::to_string(recoveryTicksFromSeconds(profile.rangedRecoverySeconds))', 'ranged recovery'),
              ('std::to_string(hours) + "h " + std::to_string(minutes) + "m"', 'std::to_string(hours) + "시간 " + std::to_string(minutes) + "분"', 'short hour minute duration'),
              ('std::to_string(hours) + "h"', 'std::to_string(hours) + "시간"', 'short hour duration'),
              ('std::to_string(minutes) + "m " + std::to_string(seconds) + "s"', 'std::to_string(minutes) + "분 " + std::to_string(seconds) + "초"', 'short minute second duration'),
              ('std::to_string(minutes) + "m"', 'std::to_string(minutes) + "분"', 'short minute duration'),
              ('std::to_string(seconds) + "s"', 'std::to_string(seconds) + "초"', 'short second duration'),
              ('std::to_string(hours) + (hours == 1 ? " Hour" : " Hours")', 'std::to_string(hours) + "시간"', 'detail hours'),
              ('std::to_string(minutes) + (minutes == 1 ? " Minute" : " Minutes")', 'std::to_string(minutes) + "분"', 'detail minutes'),
              ('std::to_string(seconds) + (seconds == 1 ? " Second" : " Seconds")', 'std::to_string(seconds) + "초"', 'detail seconds'),
              ('return "0 Seconds";', 'return "0초";', 'zero duration'),
              ('"Blaster weapons provide an accurate ranged attack. With scaling damage enabled, only "\n                        "Grandmaster rank adds damage per skill point."', '"블래스터 무기는 정확한 원거리 공격을 제공합니다. 피해량 증가 설정에서는 "\n                        "그랜드마스터 등급에서만 기술 포인트당 피해가 증가합니다."', 'blaster description'),
              ('"Skill added to Attack Bonus (double effect)"', '"기술 점수가 공격 보너스에 더해짐(2배 효과)"', 'blaster expert'),
              ('"Skill added to Attack Bonus (triple effect)"', '"기술 점수가 공격 보너스에 더해짐(3배 효과)"', 'blaster master'),
              ('"Skill added to Attack Bonus (quintuple effect); +1 damage per skill point"', '"기술 점수가 공격 보너스에 더해짐(5배 효과); 기술 포인트당 피해 +1"', 'blaster grandmaster'),
              ('{"OutdoorFlyBuffIcon", "OutdoorStandardFlyBuffIcon", "Fly", PartyBuffId::Fly, true}', '{"OutdoorFlyBuffIcon", "OutdoorStandardFlyBuffIcon", "비행", PartyBuffId::Fly, true}', 'fly buff'),
              ('"Torch Light",\n            PartyBuffId::TorchLight', '"횃불",\n            PartyBuffId::TorchLight', 'torch buff'),
              ('"Wizard Eye",\n            PartyBuffId::WizardEye', '"마법사의 눈",\n            PartyBuffId::WizardEye', 'wizard eye buff'),
              ('"Feather Fall",\n            PartyBuffId::FeatherFall', '"깃털 낙하",\n            PartyBuffId::FeatherFall', 'feather fall buff'),
              ('"Stoneskin",\n            PartyBuffId::Stoneskin', '"돌가죽",\n            PartyBuffId::Stoneskin', 'stoneskin buff'),
              ('"Day of the Gods",\n            PartyBuffId::DayOfGods', '"신들의 날",\n            PartyBuffId::DayOfGods', 'day of gods buff'),
              ('"Protection from Magic",\n            PartyBuffId::ProtectionFromMagic', '"마법 보호",\n            PartyBuffId::ProtectionFromMagic', 'protection buff'),
              ('"Fire Resistance",\n            PartyBuffId::FireResistance', '"화염 저항",\n            PartyBuffId::FireResistance', 'fire resistance buff'),
              ('"Water Resistance",\n            PartyBuffId::WaterResistance', '"물 저항",\n            PartyBuffId::WaterResistance', 'water resistance buff'),
              ('"Air Resistance",\n            PartyBuffId::AirResistance', '"공기 저항",\n            PartyBuffId::AirResistance', 'air resistance buff'),
              ('"Earth Resistance",\n            PartyBuffId::EarthResistance', '"대지 저항",\n            PartyBuffId::EarthResistance', 'earth resistance buff'),
              ('"Mind Resistance",\n            PartyBuffId::MindResistance', '"정신 저항",\n            PartyBuffId::MindResistance', 'mind resistance buff'),
              ('"Body Resistance",\n            PartyBuffId::BodyResistance', '"육체 저항",\n            PartyBuffId::BodyResistance', 'body resistance buff'),
              ('{"OutdoorBuffBody_Shield", "OutdoorStandardBuffBody_Shield", "Shield", PartyBuffId::Shield, false}', '{"OutdoorBuffBody_Shield", "OutdoorStandardBuffBody_Shield", "방패", PartyBuffId::Shield, false}', 'shield buff'),
              ('{"OutdoorBuffBody_Heroism", "OutdoorStandardBuffBody_Heroism", "Heroism", PartyBuffId::Heroism, false}', '{"OutdoorBuffBody_Heroism", "OutdoorStandardBuffBody_Heroism", "영웅심", PartyBuffId::Heroism, false}', 'heroism buff'),
              ('{"OutdoorBuffBody_Haste", "OutdoorStandardBuffBody_Haste", "Haste", PartyBuffId::Haste, false}', '{"OutdoorBuffBody_Haste", "OutdoorStandardBuffBody_Haste", "가속", PartyBuffId::Haste, false}', 'haste buff'),
              ('"Immolation",\n            PartyBuffId::Immolation', '"화염의 장막",\n            PartyBuffId::Immolation', 'immolation buff'),
              ('body = "No active buffs";', 'body = "활성 강화 효과 없음";', 'no buffs'),
              ('overlay.title = "Active Buffs";', 'overlay.title = "활성 강화 효과";', 'buff title'),
              ('pCharacter->name.empty() ? "Member" : pCharacter->name', 'pCharacter->name.empty() ? "파티원" : pCharacter->name', 'member fallback'),
              ('overlay.title = characterClass.empty() ? characterName : characterName + " the " + characterClass;', 'overlay.title = characterClass.empty() ? characterName : characterName + " (" + characterClass + ")";', 'character title'),
              ('{"Bless", CharacterBuffId::Bless}', '{"축복", CharacterBuffId::Bless}', 'character bless'),
              ('{"Fate", CharacterBuffId::Fate}', '{"운명", CharacterBuffId::Fate}', 'character fate'),
              ('{"Preservation", CharacterBuffId::Preservation}', '{"생명 보존", CharacterBuffId::Preservation}', 'character preservation'),
              ('{"Regeneration", CharacterBuffId::Regeneration}', '{"재생", CharacterBuffId::Regeneration}', 'character regeneration'),
              ('{"Hammerhands", CharacterBuffId::Hammerhands}', '{"망치손", CharacterBuffId::Hammerhands}', 'character hammerhands'),
              ('{"Pain Reflection", CharacterBuffId::PainReflection}', '{"고통 반사", CharacterBuffId::PainReflection}', 'character pain reflection'),
              ('{"Fire Aura", CharacterBuffId::FireAura}', '{"화염 오라", CharacterBuffId::FireAura}', 'character fire aura'),
              ('{"Vampiric Weapon", CharacterBuffId::VampiricWeapon}', '{"흡혈 무기", CharacterBuffId::VampiricWeapon}', 'character vampiric weapon'),
              ('{"Mistform", CharacterBuffId::Mistform}', '{"미스트폼", CharacterBuffId::Mistform}', 'character mistform'),
              ('{"Glamour", CharacterBuffId::Glamour}', '{"매혹", CharacterBuffId::Glamour}', 'character glamour'),
          ]
          for old, new, label in replacements:
              text = replace_exact(text, old, new, label)
          path.write_text(text, encoding='utf-8')

          # Character/item inspect display strings only. Logic comparisons remain English.
          path = Path('game/ui/GameplayPartyOverlayRenderer.cpp')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('return "Day of Protection";', 'return "보호의 날";', 'inspect day protection'),
              ('return "Hour of Power";', 'return "힘의 시간";', 'inspect hour power'),
              ('return "Pain Reflection";', 'return "고통 반사";', 'inspect pain reflection'),
              ('return "Hammerhands";', 'return "망치손";', 'inspect hammerhands'),
              ('return "Haste";', 'return "가속";', 'inspect haste'),
              ('return "Shield";', 'return "방패";', 'inspect shield'),
              ('return "Stoneskin";', 'return "돌가죽";', 'inspect stoneskin'),
              ('return "Bless";', 'return "축복";', 'inspect bless'),
              ('return "Fate";', 'return "운명";', 'inspect fate'),
              ('return "Heroism";', 'return "영웅심";', 'inspect heroism'),
              ('return value >= 200 ? "Imm" : std::to_string(value);', 'return value >= 200 ? "면역" : std::to_string(value);', 'monster resistance'),
              ('return "Not identified";', 'return "미감정";', 'unidentified item'),
              ('const std::string label = "Skill bonus: ";', 'const std::string label = "기술 보너스: ";', 'skill bonus'),
              ('"Hit Points : " + overlay.hitPointsText', '"생명력 : " + overlay.hitPointsText', 'detail hp'),
              ('"Spell Points : " + overlay.spellPointsText', '"주문력 : " + overlay.spellPointsText', 'detail sp'),
              ('"Condition: " + overlay.conditionText', '"상태: " + overlay.conditionText', 'detail condition'),
              ('"Quick Spell: " + overlay.quickSpellText', '"빠른 주문: " + overlay.quickSpellText', 'detail quick spell'),
              ('"Active Spells:"', '"활성 주문:"', 'active spells'),
              ('summary.combat.shoot ? std::to_string(*summary.combat.shoot) : "N/A"', 'summary.combat.shoot ? std::to_string(*summary.combat.shoot) : "해당 없음"', 'shoot n/a'),
              ('awards = "Awards earned: " + std::to_string(awardCount);', 'awards = "획득한 업적: " + std::to_string(awardCount);', 'awards earned'),
              ('pCharacter != nullptr ? "Skill Points: " + std::to_string(pCharacter->skillPoints) : "Skill Points: 0"', 'pCharacter != nullptr ? "기술 점수: " + std::to_string(pCharacter->skillPoints) : "기술 점수: 0"', 'skill points placeholder'),
          ]
          for old, new, label in replacements:
              expected = 2 if label == 'unidentified item' else 1
              text = replace_exact(text, old, new, label, expected)
          path.write_text(text, encoding='utf-8')

          # Outdoor item inspection / pickup result are direct player-facing returns.
          path = Path('game/outdoor/OutdoorGameView.cpp')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(text, 'return "Not identified";', 'return "미감정";', 'outdoor unidentified')
          text = replace_exact(
              text,
              'return "You found " + std::to_string(goldAmount) + " gold and an item (" + resolvedItemName + ")!";',
              'return std::to_string(goldAmount) + "골드와 아이템 (" + resolvedItemName + ")을 발견했습니다!";',
              'outdoor gold and item')
          path.write_text(text, encoding='utf-8')

      - name: Verify English display residuals removed
        shell: bash
        run: |
          ! grep -nE 'Recovery time:|Active Buffs|No active buffs|Skill bonus:|Hit Points :|Spell Points :|Quick Spell:|Awards earned:|return "Not identified"|You found .*gold and an item' \
            game/ui/GameplayHudOverlaySupport.cpp \
            game/ui/GameplayPartyOverlayRenderer.cpp \
            game/outdoor/OutdoorGameView.cpp
          grep -q '활성 강화 효과' game/ui/GameplayHudOverlaySupport.cpp
          grep -q '회복 시간:' game/ui/GameplayHudOverlaySupport.cpp
          grep -q '획득한 업적:' game/ui/GameplayPartyOverlayRenderer.cpp
          grep -q '미감정' game/outdoor/OutdoorGameView.cpp

      - name: Commit confirmed display fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ui/GameplayHudOverlaySupport.cpp game/ui/GameplayPartyOverlayRenderer.cpp game/outdoor/OutdoorGameView.cpp
          git commit -m "fix(korean): localize confirmed inspect overlays"
          git push origin HEAD:korean-localization
