name: Fast one-shot fix Korean decoration workflow

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/fix-korean-decoration-workflow-fast.yml"

permissions:
  contents: write

jobs:
  patch-workflow:
    if: github.event.head_commit.message == 'Add fast one-shot decoration workflow fix'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target workflow only
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/korean-translation-import.yml

      - name: Fix translation import sparse checkout and package guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/korean-translation-import.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '      - "game/ui/screens/**"\n      - "game/outdoor/OutdoorInteractionController.cpp"',
                  '      - "game/ui/screens/**"\n      - "game/ui/KoreanDecorationText.h"\n      - "game/gameplay/GameplayInteractionController.cpp"\n      - "game/outdoor/OutdoorInteractionController.cpp"',
              ),
              (
                  '            /game/ui/screens/**\n            /game/outdoor/OutdoorInteractionController.cpp',
                  '            /game/ui/screens/**\n            /game/ui/KoreanDecorationText.h\n            /game/gameplay/GameplayInteractionController.cpp\n            /game/outdoor/OutdoorInteractionController.cpp',
              ),
              (
                  '            data_tables/arcomage_cards.txt \\\n            data_tables/decoration_data.txt \\\n            data_tables/english/Global.txt',
                  '            data_tables/arcomage_cards.txt \\\n            data_tables/english/Global.txt',
              ),
              (
                  "          if grep -Fxq 'data_tables/english/spells.txt' dist/korean-translation-import/engine-contents.txt; then\n            echo 'Inactive English spell-table overlay must not be packaged.' >&2\n            exit 1\n          fi",
                  "          if grep -Fxq 'data_tables/english/spells.txt' dist/korean-translation-import/engine-contents.txt; then\n            echo 'Inactive English spell-table overlay must not be packaged.' >&2\n            exit 1\n          fi\n          if grep -Fxq 'data_tables/decoration_data.txt' dist/korean-translation-import/engine-contents.txt; then\n            echo 'Decoration source Hint values are gameplay keys and must not be packaged as a localized overlay.' >&2\n            exit 1\n          fi",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one workflow fragment, found {count}: {old!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq '/game/ui/KoreanDecorationText.h' .github/workflows/korean-translation-import.yml
          grep -Fq '/game/gameplay/GameplayInteractionController.cpp' .github/workflows/korean-translation-import.yml
          test "$(grep -Fc 'data_tables/decoration_data.txt' .github/workflows/korean-translation-import.yml)" -eq 1

      - name: Commit workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/korean-translation-import.yml
          git diff --cached --check
          git commit -m "Fix Korean decoration runtime import workflow"
          git push origin HEAD:korean-localization
