name: Patch reviewed Korean dialog runtime residuals

on:
  push:
    branches: [korean-localization]
    paths:
      - .github/workflows/korean-dialog-runtime-residuals.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization
          fetch-depth: 0
          sparse-checkout: |
            game/ui/KoreanRuntimeTextOverrides.h
          sparse-checkout-cone-mode: false

      - name: Add reviewed dialog residual patterns
        shell: python
        run: |
          from pathlib import Path
          path = Path('game/ui/KoreanRuntimeTextOverrides.h')
          text = path.read_text(encoding='utf-8')
          marker = '    if (startsWith(text, "You have to be promoted to ") && endsWith(text, " to learn this skill."))\n'
          if text.count(marker) != 1:
              raise SystemExit(f'dialog insertion marker count={text.count(marker)}')
          lines = [
              '    if (text == "You failed to steal it.") return "훔치기에 실패했습니다.";\n',
              '    if (text == "Sorry, come back another day.") return "죄송하지만 다른 날 다시 오십시오.";\n',
              '    if (text == "MM9 dialogue action 0 is unresolved.") return "MM9 대화 동작 0은 아직 처리되지 않았습니다.";\n',
              '    if (text == "You do not have enough gold.") return "골드가 부족합니다.";\n',
              '    if (startsWith(text, "Become ") && text.find(" in ") != std::string::npos && text.find(" for ") != std::string::npos && endsWith(text, " gold"))\n',
              '    {\n',
              '        const size_t inPos = text.find(" in ", 7);\n',
              '        const size_t forPos = text.rfind(" for ");\n',
              '        const std::string rank = text.substr(7, inPos - 7);\n',
              '        const std::string rankKo = rank == "Expert" ? "전문가" : rank == "Master" ? "마스터" : rank == "Grandmaster" ? "그랜드마스터" : rank;\n',
              '        return text.substr(inPos + 4, forPos - (inPos + 4)) + " " + rankKo + " 승급 - " + text.substr(forPos + 5, text.size() - (forPos + 5) - 5) + "골드";\n',
              '    }\n',
              '    if (text.find(" is now a ") != std::string::npos && text.find(" in ") != std::string::npos && endsWith(text, "."))\n',
              '    {\n',
              '        const size_t rankPos = text.find(" is now a ");\n',
              '        const size_t inPos = text.find(" in ", rankPos + 10);\n',
              '        const std::string rank = text.substr(rankPos + 10, inPos - (rankPos + 10));\n',
              '        if (rank == "Expert" || rank == "Master" || rank == "Grandmaster")\n',
              '        {\n',
              '            const std::string rankKo = rank == "Expert" ? "전문가" : rank == "Master" ? "마스터" : "그랜드마스터";\n',
              '            return text.substr(0, rankPos) + ": " + text.substr(inPos + 4, text.size() - (inPos + 4) - 1) + " " + rankKo + " 승급 완료.";\n',
              '        }\n',
              '    }\n',
              '\n',
          ]
          text = text.replace(marker, ''.join(lines) + marker)
          path.write_text(text, encoding='utf-8')

      - name: Compile focused dialog QA
        shell: bash
        run: |
          cat > /tmp/qa.cpp <<'CPP'
          #include "game/ui/KoreanRuntimeTextOverrides.h"
          #include <iostream>
          #include <string>
          #include <vector>
          using OpenYAMM::Game::KoreanRuntimeText::koreanRuntimeTextOverride;
          int main() {
              const std::vector<std::pair<std::string, std::string>> cases = {
                  {"You failed to steal it.", "훔치기에 실패했습니다."},
                  {"Sorry, come back another day.", "죄송하지만 다른 날 다시 오십시오."},
                  {"MM9 dialogue action 0 is unresolved.", "MM9 대화 동작 0은 아직 처리되지 않았습니다."},
                  {"You do not have enough gold.", "골드가 부족합니다."},
                  {"Become Expert in Sword for 500 gold", "Sword 전문가 승급 - 500골드"},
                  {"Become Master in Merchant for 2000 gold", "Merchant 마스터 승급 - 2000골드"},
                  {"Catherine is now a Expert in Sword.", "Catherine: Sword 전문가 승급 완료."},
                  {"Catherine is now a Grandmaster in Merchant.", "Catherine: Merchant 그랜드마스터 승급 완료."},
              };
              for (const auto &[input, expected] : cases) {
                  const auto actual = koreanRuntimeTextOverride(input);
                  if (!actual || *actual != expected) {
                      std::cerr << "FAIL: " << input << " => " << (actual ? *actual : "<none>") << " expected " << expected << '\n';
                      return 1;
                  }
              }
              return 0;
          }
          CPP
          g++ -std=c++20 -I. /tmp/qa.cpp -o /tmp/qa
          /tmp/qa

      - name: Commit reviewed dialog residuals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ui/KoreanRuntimeTextOverrides.h
          git commit -m "fix(korean): localize dialog runtime residuals"
          git push origin HEAD:korean-localization
