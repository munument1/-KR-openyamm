name: Temporary skeltrans speech audit

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-skeltrans-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-skeltrans:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out only skeltrans media
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets_dev/worlds/mm8/videos/Cutscenes/skeltrans.ogv
            /data/Anims/Magicdod.vid/skeltrans.bik

      - name: Install media and speech tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir faster-whisper

      - name: Prepare OGV and BIK audio variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p skeltrans-audit/audio
          for pair in \
            "ogv|assets_dev/worlds/mm8/videos/Cutscenes/skeltrans.ogv" \
            "bik|data/Anims/Magicdod.vid/skeltrans.bik"; do
            kind="${pair%%|*}"
            src="${pair#*|}"
            ffmpeg -hide_banner -loglevel error -y -i "$src" -vn -ac 1 -ar 16000 \
              "skeltrans-audit/audio/${kind}-plain.wav"
            ffmpeg -hide_banner -loglevel error -y -i "$src" -vn -ac 1 -ar 16000 \
              -af "highpass=f=90,lowpass=f=6500,afftdn=nf=-25,dynaudnorm=f=150:g=9" \
              "skeltrans-audit/audio/${kind}-clean.wav"
            ffmpeg -hide_banner -loglevel error -y -ss 11 -i "$src" -vn -ac 1 -ar 16000 \
              "skeltrans-audit/audio/${kind}-final-plain.wav"
            ffmpeg -hide_banner -loglevel error -y -ss 11 -i "$src" -vn -ac 1 -ar 16000 \
              -af "highpass=f=90,lowpass=f=6500,afftdn=nf=-25,dynaudnorm=f=150:g=9" \
              "skeltrans-audit/audio/${kind}-final-clean.wav"
          done
          sha256sum skeltrans-audit/audio/*.wav > skeltrans-audit/audio-sha256.txt

      - name: Cross-check transcript with multiple models
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          root = Path('skeltrans-audit/audio')
          audio_files = sorted(root.glob('*.wav'))
          model_names = ['small.en', 'medium.en', 'distil-large-v3']
          records = []

          for model_name in model_names:
              print('LOADING', model_name, flush=True)
              model = WhisperModel(model_name, device='cpu', compute_type='int8')
              for audio in audio_files:
                  for condition in (False, True):
                      segments, info = model.transcribe(
                          str(audio),
                          language='en',
                          beam_size=5,
                          best_of=5,
                          vad_filter=False,
                          word_timestamps=True,
                          condition_on_previous_text=condition,
                          temperature=0.0,
                      )
                      out_segments = []
                      words_flat = []
                      for segment in segments:
                          words = []
                          for word in segment.words or []:
                              entry = {
                                  'start': round(float(word.start), 3),
                                  'end': round(float(word.end), 3),
                                  'text': word.word,
                                  'probability': round(float(word.probability), 4),
                              }
                              words.append(entry)
                              words_flat.append(entry)
                          out_segments.append({
                              'start': round(float(segment.start), 3),
                              'end': round(float(segment.end), 3),
                              'text': segment.text.strip(),
                              'avg_logprob': round(float(segment.avg_logprob), 4),
                              'no_speech_prob': round(float(segment.no_speech_prob), 4),
                              'words': words,
                          })
                      record = {
                          'model': model_name,
                          'audio': audio.name,
                          'condition_on_previous_text': condition,
                          'language': info.language,
                          'language_probability': round(float(info.language_probability), 4),
                          'segments': out_segments,
                          'words': words_flat,
                          'text': ' '.join(s['text'] for s in out_segments).strip(),
                      }
                      records.append(record)
                      print(model_name, audio.name, 'condition=', condition, '=>', record['text'], flush=True)
              del model

          output = Path('skeltrans-audit/skeltrans-asr-matrix.json')
          output.write_text(
              json.dumps({'format': 1, 'records': records}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload skeltrans audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: skeltrans-speech-audit
          path: |
            skeltrans-audit/skeltrans-asr-matrix.json
            skeltrans-audit/audio-sha256.txt
          if-no-files-found: error
          retention-days: 7
