name: Korean connect runtime overrides

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/korean-connect-runtime-overrides.yml

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 0

      - name: Connect runtime translations at display boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Keep runtime terminology aligned with the reviewed MMMerge spell names.
          helper_path = Path('game/ui/KoreanRuntimeTextOverrides.h')
          helper = helper_path.read_text(encoding='utf-8')
          terminology = {
              '마을 이동 주문 데이터가 없습니다': '도시 귀환 주문 데이터가 없습니다',
              '마을 이동 목적지를 선택하십시오': '도시 귀환 목적지를 선택하십시오',
              '마을 이동 목적지를 사용할 수 없습니다': '도시 귀환 목적지를 사용할 수 없습니다',
              '(으)로 마을 이동': '(으)로 도시 귀환',
              '표식을 설치하거나 귀환하십시오': '봉화를 설치하거나 귀환하십시오',
              '표식 설치': '봉화 설치',
              '에 표식 설치': '에 봉화 설치',
              '로이드의 표식': '로이드의 봉화',
              '실외에서는 무지갯빛을 시전할 수 없습니다!': '실외에서는 프리즘 광선을 시전할 수 없습니다!',
              '장착한 장비 때문에 신의 개입을 시전할 수 없습니다': '장착한 장비 때문에 신성한 개입을 시전할 수 없습니다',
          }
          for old, new in terminology.items():
              helper = helper.replace(old, new)
          helper_path.write_text(helper, encoding='utf-8')

          hud_path = Path('game/ui/GameplayHudCommon.cpp')
          hud = hud_path.read_text(encoding='utf-8')
          include_anchor = '#include "game/ui/Utf8Text.h"\n'
          include_line = '#include "game/ui/KoreanRuntimeTextOverrides.h"\n'
          if include_line not in hud:
              if include_anchor not in hud:
                  raise SystemExit('GameplayHudCommon include anchor missing')
              hud = hud.replace(include_anchor, include_anchor + include_line, 1)

          function_anchor = '''std::string localizedGameplayHudText(const std::string &text)
          {
              if (text.empty())
              {
                  return text;
              }

          '''
          function_replacement = '''std::string localizedGameplayHudText(const std::string &text)
          {
              if (text.empty())
              {
                  return text;
              }

              if (const std::optional<std::string> overrideText = KoreanRuntimeText::koreanRuntimeTextOverride(text))
              {
                  return *overrideText;
              }

          '''
          if 'KoreanRuntimeText::koreanRuntimeTextOverride(text)' not in hud:
              if function_anchor not in hud:
                  raise SystemExit('localizedGameplayHudText anchor missing')
              hud = hud.replace(function_anchor, function_replacement, 1)
          hud_path.write_text(hud, encoding='utf-8')

          menu_cpp_path = Path('game/ui/MenuScreenBaseKorean.cpp')
          menu_cpp = menu_cpp_path.read_text(encoding='utf-8')
          menu_include_anchor = '#include "game/ui/Utf8Text.h"\n'
          if include_line not in menu_cpp:
              if menu_include_anchor not in menu_cpp:
                  raise SystemExit('MenuScreenBaseKorean include anchor missing')
              menu_cpp = menu_cpp.replace(menu_include_anchor, menu_include_anchor + include_line, 1)
          menu_cpp_path.write_text(menu_cpp, encoding='utf-8')

          inc_path = Path('game/ui/MenuScreenKoreanText.inc')
          inc = inc_path.read_text(encoding='utf-8')

          measure_anchor = '''float MenuScreenBase::measureTextWidth(const std::string &fontName, const std::string &text, float scale)
          {
              if (!menuTextNeedsUnicode(text))
          '''
          measure_replacement = '''float MenuScreenBase::measureTextWidth(const std::string &fontName, const std::string &text, float scale)
          {
              const std::string localizedText = KoreanRuntimeText::koreanRuntimeTextOverride(text).value_or(text);
              if (!menuTextNeedsUnicode(localizedText))
          '''
          if 'const std::string localizedText = KoreanRuntimeText::koreanRuntimeTextOverride(text).value_or(text);' not in inc:
              if measure_anchor not in inc:
                  raise SystemExit('Menu measureTextWidth anchor missing')
              inc = inc.replace(measure_anchor, measure_replacement, 1)

              old = 'return measureTextWidthLegacy(fontName, text, scale);'
              new = 'return measureTextWidthLegacy(fontName, localizedText, scale);'
              if old not in inc:
                  raise SystemExit('Menu measure legacy call missing')
              inc = inc.replace(old, new, 1)

              old = 'const std::vector<uint32_t> codePoints = decodeMenuTextCodePoints(text);'
              new = 'const std::vector<uint32_t> codePoints = decodeMenuTextCodePoints(localizedText);'
              if inc.count(old) < 2:
                  raise SystemExit('Expected at least two menu display decode calls')
              inc = inc.replace(old, new, 2)

              draw_anchor = '''bool MenuScreenBase::drawText(
              const std::string &fontName,
              const std::string &text,
              float pixelX,
              float pixelY,
              uint32_t colorAbgr,
              float scale,
              bool drawShadow)
          {
              if (!menuTextNeedsUnicode(text))
          '''
              draw_replacement = '''bool MenuScreenBase::drawText(
              const std::string &fontName,
              const std::string &text,
              float pixelX,
              float pixelY,
              uint32_t colorAbgr,
              float scale,
              bool drawShadow)
          {
              const std::string localizedText = KoreanRuntimeText::koreanRuntimeTextOverride(text).value_or(text);
              if (!menuTextNeedsUnicode(localizedText))
          '''
              if draw_anchor not in inc:
                  raise SystemExit('Menu drawText anchor missing')
              inc = inc.replace(draw_anchor, draw_replacement, 1)

              old = 'return drawTextLegacy(fontName, text, pixelX, pixelY, colorAbgr, scale, drawShadow);'
              new = 'return drawTextLegacy(fontName, localizedText, pixelX, pixelY, colorAbgr, scale, drawShadow);'
              if old not in inc:
                  raise SystemExit('Menu draw legacy call missing')
              inc = inc.replace(old, new, 1)

          inc_path.write_text(inc, encoding='utf-8')

          # Verify only the two MenuScreen display entrypoints use the override.
          hud = hud_path.read_text(encoding='utf-8')
          inc = inc_path.read_text(encoding='utf-8')
          if hud.count('KoreanRuntimeText::koreanRuntimeTextOverride(text)') != 1:
              raise SystemExit('HUD runtime override connection count is unexpected')
          if inc.count('KoreanRuntimeText::koreanRuntimeTextOverride(text).value_or(text)') != 2:
              raise SystemExit('Menu runtime override connection count is unexpected')
          if inc.count('decodeMenuTextCodePoints(localizedText)') < 2:
              raise SystemExit('Menu display decoding is not using localized text')
          PY
          git diff --check

      - name: Commit display-boundary connection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ui/KoreanRuntimeTextOverrides.h game/ui/GameplayHudCommon.cpp game/ui/MenuScreenBaseKorean.cpp game/ui/MenuScreenKoreanText.inc
          git commit -m "feat(korean): localize hardcoded runtime display text"
          git push origin HEAD:korean-localization
