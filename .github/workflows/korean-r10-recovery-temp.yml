name: Temporary recover OpenYAMM Korean r10 release

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-r10-recovery-temp.yml"

permissions:
  contents: read

jobs:
  korean_overlay:
    name: Build fixed Korean r10 overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out r10 tag sources
        uses: actions/checkout@v7
        with:
          ref: 0.11-korean-r10
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /korean/**
            /game/ui/KoreanDecorationText.h
            /assets_dev/engine/data_tables/**
            /assets_dev/worlds/mm6/_legacy/events/**
            /assets_dev/worlds/mm6/events/maps/**
            /assets_dev/worlds/mm7/_legacy/events/**
            /assets_dev/worlds/mm7/events/maps/**
            /assets_dev/worlds/mm8/_legacy/events/**
            /assets_dev/worlds/mm8/events/maps/**
            /assets_dev/worlds/mmmerge/events/maps/**

      - name: Check out MMMerge Korean translation source
        uses: actions/checkout@v7
        with:
          repository: munument1/-KR-MMMerge
          ref: f37e61eeab01e5aceaa73ec307881ed91d4f72b5
          path: _mmmerge
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Data/Text localization/**

      - name: Apply release-pipeline parity fix in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('korean/build_release_overlay.sh')
          text = path.read_text(encoding='utf-8')
          needle = 'python3 korean/tools/extend_arcomage_catalog.py --fail-on-review\n'
          insertion = needle + 'python3 korean/tools/extend_decoration_catalog.py --fail-on-review\n'
          if insertion not in text:
              if needle not in text:
                  raise SystemExit('release overlay insertion point not found')
              text = text.replace(needle, insertion, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Generate and validate Korean r10 overlay
        run: bash korean/build_release_overlay.sh _mmmerge dist/korean-release-overlay

      - name: Verify r10 cutscene subtitle payload
        run: |
          unzip -Z1 dist/korean-release-overlay/korean/worlds/mm8.zip | grep -Fxq 'subtitles/skeltrans.srt'
          unzip -p dist/korean-release-overlay/korean/worlds/mm8.zip subtitles/skeltrans.srt | grep -Fq '이제 탈출합시다.'

      - name: Upload Korean r10 overlay
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-r10-korean-overlay
          path: dist/korean-release-overlay/korean
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android arm64 r10 release
    needs: korean_overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENYAMM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENYAMM_ANDROID_KEYSTORE_PASSWORD }}
      OPENYAMM_ANDROID_KEY_ALIAS: openyamm
      OPENYAMM_ANDROID_KEY_PASSWORD: ${{ secrets.OPENYAMM_ANDROID_KEYSTORE_PASSWORD }}
      OPENYAMM_ANDROID_VERSION_NAME: 0.11-korean-r10
      OPENYAMM_ANDROID_VERSION_CODE: 1110
    steps:
      - name: Check out r10 release sources
        uses: actions/checkout@v7
        with:
          ref: 0.11-korean-r10
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /settings.ini
            /cmake/
            /engine/
            /game/
            /android/
            /tools/openyamm_shaderc_stubs.cpp
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Download Korean r10 overlay
        uses: actions/download-artifact@v8
        with:
          name: openyamm-r10-korean-overlay
          path: release-overlay/korean

      - name: Stage Korean Android assets
        run: |
          mkdir -p assets
          rm -rf assets/korean
          cp -a release-overlay/korean assets/korean
          test -s assets/korean/engine.zip
          test -s assets/korean/worlds/mm6.zip
          test -s assets/korean/worlds/mm7.zip
          test -s assets/korean/worlds/mm8.zip
          test -s assets/korean/worlds/mmmerge.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle.properties
            android/app/*.gradle

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dev libx11-dev libxext-dev

      - name: Restore Android signing key
        env:
          OPENYAMM_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENYAMM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$OPENYAMM_ANDROID_KEYSTORE_BASE64" || -z "$OPENYAMM_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Android signing secrets are not configured."
            exit 1
          fi
          keystore="$RUNNER_TEMP/openyamm-package.jks"
          printf '%s' "$OPENYAMM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass "$OPENYAMM_ANDROID_KEYSTORE_PASSWORD" -alias "$OPENYAMM_ANDROID_KEY_ALIAS" >/dev/null
          echo "OPENYAMM_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Configure host tools
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=OFF
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF
          -DSDL_ALSA=OFF
          -DSDL_JACK=OFF
          -DSDL_KMSDRM=OFF
          -DSDL_PIPEWIRE=OFF
          -DSDL_PULSEAUDIO=OFF
          -DSDL_SNDIO=OFF
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DSDL_WAYLAND=OFF
          -DSDL_X11=OFF

      - name: Build host shader compiler
        run: cmake --build build --target openyamm_shaderc --parallel 4

      - name: Build signed Android package
        run: android/build_release_apk.sh --repack-assets

      - name: Prepare Android r10 artifact
        run: |
          mkdir -p dist
          output='OpenYAMM-0.11-korean-r10-android-arm64.apk'
          cp android/app-release.apk "dist/$output"
          test -s "dist/$output"
          test "$(stat -c '%s' "dist/$output")" -lt 2147483648
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/$output"
          unzip -Z1 "dist/$output" > android-package-contents.txt
          grep -Fxq 'lib/arm64-v8a/libmain.so' android-package-contents.txt
          grep -Fxq 'assets/korean/worlds/mm8.zip' android-package-contents.txt
          unzip -p "dist/$output" assets/korean/worlds/mm8.zip > /tmp/mm8-ko.zip
          unzip -Z1 /tmp/mm8-ko.zip | grep -Fxq 'subtitles/skeltrans.srt'
          (cd dist && sha256sum "$output" > "$output.sha256")

      - name: Upload Android r10 artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-r10-android
          path: |
            dist/OpenYAMM-0.11-korean-r10-android-arm64.apk
            dist/OpenYAMM-0.11-korean-r10-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Windows x64 r10 release
    needs: korean_overlay
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out r10 release sources
        uses: actions/checkout@v7
        with:
          ref: 0.11-korean-r10
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /settings_release.ini
            /cmake/
            /engine/
            /game/
            /packaging/
            /tools/openyamm_shaderc_stubs.cpp
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Download Korean r10 overlay
        uses: actions/download-artifact@v8
        with:
          name: openyamm-r10-korean-overlay
          path: release-overlay/korean

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      - name: Configure Windows r10 build
        run: >-
          cmake -S . -B build-nightly-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=ON
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF
          -DOPENYAMM_KOREAN_OVERLAY_DIR="$PWD/release-overlay/korean"

      - name: Build Windows r10 package
        run: cmake --build build-nightly-windows --target openyamm_windows_release_zip --parallel 4

      - name: Prepare Windows r10 artifact
        run: |
          archive='build-nightly-windows/release/OpenYAMM-windows-Release.zip'
          output='OpenYAMM-0.11-korean-r10-windows-x64.zip'
          test -s "$archive"
          cmake -E tar tf "$archive" > windows-package-contents.txt
          grep -Fxq 'OpenYAMM/openyamm.exe' windows-package-contents.txt
          grep -Fxq 'OpenYAMM/assets/korean/worlds/mm8.zip' windows-package-contents.txt
          mkdir -p dist
          cp "$archive" "dist/$output"
          unzip -p "dist/$output" OpenYAMM/assets/korean/worlds/mm8.zip > /tmp/mm8-ko.zip
          unzip -Z1 /tmp/mm8-ko.zip | grep -Fxq 'subtitles/skeltrans.srt'
          (cd dist && sha256sum "$output" > "$output.sha256")

      - name: Upload Windows r10 artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-r10-windows
          path: |
            dist/OpenYAMM-0.11-korean-r10-windows-x64.zip
            dist/OpenYAMM-0.11-korean-r10-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  flatpak:
    name: Flatpak x86_64 r10 release
    needs: korean_overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out r10 release sources
        uses: actions/checkout@v7
        with:
          ref: 0.11-korean-r10
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /settings_release.ini
            /cmake/
            /engine/
            /game/
            /packaging/
            /tools/openyamm_shaderc_stubs.cpp
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Download Korean r10 overlay
        uses: actions/download-artifact@v8
        with:
          name: openyamm-r10-korean-overlay
          path: release-overlay/korean

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y elfutils flatpak flatpak-builder ostree

      - name: Build Flatpak r10 bundle
        env:
          OPENYAMM_KOREAN_OVERLAY_DIR: ${{ github.workspace }}/release-overlay/korean
        run: |
          mkdir -p dist
          packaging/flatpak/build_flatpak.sh \
            --output-dir="$GITHUB_WORKSPACE/build-nightly-flatpak" \
            --bundle="$GITHUB_WORKSPACE/dist/OpenYAMM-0.11-korean-r10-x86_64.flatpak" \
            --branch='0.11-korean-r10' \
            --no-install \
            --add-flathub \
            --install-deps \
            --jobs=4
          test -s dist/OpenYAMM-0.11-korean-r10-x86_64.flatpak
          test "$(stat -c '%s' dist/OpenYAMM-0.11-korean-r10-x86_64.flatpak)" -lt 2147483648
          (cd dist && sha256sum OpenYAMM-0.11-korean-r10-x86_64.flatpak > OpenYAMM-0.11-korean-r10-x86_64.flatpak.sha256)

      - name: Upload Flatpak r10 artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-r10-flatpak
          path: |
            dist/OpenYAMM-0.11-korean-r10-x86_64.flatpak
            dist/OpenYAMM-0.11-korean-r10-x86_64.flatpak.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish recovered r10 release
    needs:
      - android
      - windows
      - flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download recovered r10 artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: openyamm-r10-*
          merge-multiple: true

      - name: Verify recovered r10 assets
        run: |
          cd release-assets
          sha256sum -c OpenYAMM-0.11-korean-r10-android-arm64.apk.sha256
          sha256sum -c OpenYAMM-0.11-korean-r10-windows-x64.zip.sha256
          sha256sum -c OpenYAMM-0.11-korean-r10-x86_64.flatpak.sha256
          test "$(stat -c '%s' OpenYAMM-0.11-korean-r10-android-arm64.apk)" -lt 2147483648
          test "$(stat -c '%s' OpenYAMM-0.11-korean-r10-windows-x64.zip)" -lt 2147483648
          test "$(stat -c '%s' OpenYAMM-0.11-korean-r10-x86_64.flatpak)" -lt 2147483648

      - name: Publish GitHub r10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 0.11-korean-r10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::0.11-korean-r10 release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create 0.11-korean-r10 release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'OpenYAMM 0.11-korean-r10' \
            --generate-notes
