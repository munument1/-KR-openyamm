name: Temporary publish OpenYAMM Korean r10 release

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-r10-recovery-temp.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish validated r10 release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download Android r10 artifact
        uses: actions/download-artifact@v8
        with:
          name: openyamm-r10-android
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34416541260

      - name: Download Windows r10 artifact
        uses: actions/download-artifact@v8
        with:
          name: openyamm-r10-windows
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34416541260

      - name: Download Flatpak r10 artifact
        uses: actions/download-artifact@v8
        with:
          name: openyamm-r10-flatpak
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34416541260

      - name: Verify r10 release assets
        run: |
          cd release-assets
          sha256sum -c OpenYAMM-0.11-korean-r10-android-arm64.apk.sha256
          sha256sum -c OpenYAMM-0.11-korean-r10-windows-x64.zip.sha256
          sha256sum -c OpenYAMM-0.11-korean-r10-x86_64.flatpak.sha256
          test "$(stat -c '%s' OpenYAMM-0.11-korean-r10-android-arm64.apk)" -lt 2147483648
          test "$(stat -c '%s' OpenYAMM-0.11-korean-r10-windows-x64.zip)" -lt 2147483648
          test "$(stat -c '%s' OpenYAMM-0.11-korean-r10-x86_64.flatpak)" -lt 2147483648

      - name: Publish GitHub r10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 0.11-korean-r10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::0.11-korean-r10 release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create 0.11-korean-r10 \
            release-assets/OpenYAMM-0.11-korean-r10-android-arm64.apk \
            release-assets/OpenYAMM-0.11-korean-r10-android-arm64.apk.sha256 \
            release-assets/OpenYAMM-0.11-korean-r10-windows-x64.zip \
            release-assets/OpenYAMM-0.11-korean-r10-windows-x64.zip.sha256 \
            release-assets/OpenYAMM-0.11-korean-r10-x86_64.flatpak \
            release-assets/OpenYAMM-0.11-korean-r10-x86_64.flatpak.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'OpenYAMM 0.11-korean-r10' \
            --generate-notes
