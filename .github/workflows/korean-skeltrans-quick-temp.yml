name: Temporary skeltrans final-line audit

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-skeltrans-quick-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-final-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out skeltrans media only
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets_dev/worlds/mm8/videos/Cutscenes/skeltrans.ogv
            /data/Anims/Magicdod.vid/skeltrans.bik

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir faster-whisper

      - name: Extract final speech clips
        run: |
          set -euo pipefail
          mkdir -p out/audio
          for pair in \
            "ogv|assets_dev/worlds/mm8/videos/Cutscenes/skeltrans.ogv" \
            "bik|data/Anims/Magicdod.vid/skeltrans.bik"; do
            kind="${pair%%|*}"
            src="${pair#*|}"
            ffmpeg -hide_banner -loglevel error -y -ss 10.5 -i "$src" -vn -ac 1 -ar 16000 "out/audio/${kind}-plain.wav"
            ffmpeg -hide_banner -loglevel error -y -ss 10.5 -i "$src" -vn -ac 1 -ar 16000 \
              -af "highpass=f=100,lowpass=f=6000,afftdn=nf=-20,dynaudnorm=f=120:g=7" \
              "out/audio/${kind}-clean.wav"
          done

      - name: Transcribe final clips
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          records = []
          files = sorted(Path('out/audio').glob('*.wav'))
          for model_name in ('small.en', 'medium.en'):
              model = WhisperModel(model_name, device='cpu', compute_type='int8')
              for path in files:
                  segments, info = model.transcribe(
                      str(path), language='en', beam_size=10, best_of=10,
                      vad_filter=False, word_timestamps=True,
                      condition_on_previous_text=False, temperature=0.0,
                  )
                  segment_rows = []
                  for s in segments:
                      words = [
                          {'start': round(float(w.start),3), 'end': round(float(w.end),3),
                           'text': w.word, 'probability': round(float(w.probability),4)}
                          for w in (s.words or [])
                      ]
                      segment_rows.append({
                          'start': round(float(s.start),3), 'end': round(float(s.end),3),
                          'text': s.text.strip(), 'avg_logprob': round(float(s.avg_logprob),4),
                          'no_speech_prob': round(float(s.no_speech_prob),4), 'words': words,
                      })
                  text = ' '.join(x['text'] for x in segment_rows).strip()
                  row = {'model': model_name, 'audio': path.name, 'text': text, 'segments': segment_rows}
                  records.append(row)
                  print(model_name, path.name, '=>', text, flush=True)
              del model
          Path('out/skeltrans-final-line.json').write_text(
              json.dumps({'format': 1, 'records': records}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')
          PY

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: skeltrans-final-line-audit
          path: out/skeltrans-final-line.json
          if-no-files-found: error
          retention-days: 7
