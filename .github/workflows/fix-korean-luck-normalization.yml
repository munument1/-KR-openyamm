name: Fix Korean Luck normalization

on:
  push:
    branches:
      - release-r9-staging-work
    paths:
      - .github/workflows/fix-korean-luck-normalization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Korean localization branch
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: true

      - name: Fix mechanical Luck normalization scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('korean/tools/apply_source_semantic_corrections.py')
          text = path.read_text(encoding='utf-8')
          needle = '            "standard_item_enchants.txt",\n'
          replacement = '            "Global.txt",\n' + needle
          if text.count(needle) != 1:
              raise SystemExit(f'expected one Luck scope anchor, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')
          PY

      - name: Run focused semantic tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s korean/tools -p 'test_source_semantic_corrections.py'

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add korean/tools/apply_source_semantic_corrections.py
          git diff --cached --check
          git commit -m 'Preserve natural Luck phrasing outside mechanical tables'
          git push origin HEAD:korean-localization
