name: One-shot follower skill bonus trace

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/trace-follower-skill-bonus.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/**
      - name: Trace follower skill bonus usage
        shell: bash
        run: |
          set -euo pipefail
          echo '=== hiredNpcSkillBonus references ==='
          grep -RIn --exclude='NpcFollowerRuntime.cpp' 'hiredNpcSkillBonus' game || true
          echo '=== Learning references near follower mechanics ==='
          grep -RIn -E 'Learning|learningPercent|itemSkillBonuses|skillBonus' game/gameplay game/party game/ui | grep -E 'Follower|follower|Npc|NPC|Learning|learningPercent' | head -n 300 || true
