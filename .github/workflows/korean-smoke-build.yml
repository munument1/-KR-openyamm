name: Korean smoke builds

on:
  push:
    branches:
      - korean-localization
    paths:
      - "game/**"
      - "engine/**"
      - "cmake/**"
      - "android/**"
      - "korean/**"
      - "CMakeLists.txt"
      - ".github/workflows/korean-smoke-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korean-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utf8-name-input-guard:
    name: UTF-8 name input guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out UTF-8 name input sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/ui/screens/NewGameScreen.cpp
            /game/ui/screens/NewGameScreen.h
            /game/CMakeLists.txt

      - name: Verify native UTF-8 name editing
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'utf8CodePointCount(m_state.nameEditBuffer)' game/ui/screens/NewGameScreen.cpp
          grep -Fq 'isPrintableNameCodePoint(span.codePoint)' game/ui/screens/NewGameScreen.cpp
          grep -Fq 'previousUtf8CodePointOffset(m_state.nameEditBuffer, m_state.nameEditBuffer.size())' game/ui/screens/NewGameScreen.cpp
          grep -Fq 'std::string nameEditBuffer;' game/ui/screens/NewGameScreen.h
          if grep -Fq 'OPENYAMM_UTF8_NEW_GAME_NAMES' game/ui/screens/NewGameScreen.h game/CMakeLists.txt; then
            echo '::error::temporary OPENYAMM_UTF8_NEW_GAME_NAMES workaround must not return'
            exit 1
          fi
          if grep -Fq 'Utf8NameEditBuffer' game/ui/screens/NewGameScreen.h; then
            echo '::error::temporary Utf8NameEditBuffer workaround must not return'
            exit 1
          fi

  korean-overlay:
    name: Korean smoke overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Korean patch sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /korean/

      - name: Fetch IBM Plex Sans KR
        run: |
          set -euo pipefail
          mkdir -p build-korean-overlay/fonts
          curl --fail --location --retry 3 \
            --output build-korean-overlay/fonts/KoreanFallback.ttf \
            https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-kr/fonts/complete/ttf/hinted/IBMPlexSansKR-Regular.ttf
          test -s build-korean-overlay/fonts/KoreanFallback.ttf
          cp korean/licenses/IBM-Plex-OFL.txt build-korean-overlay/fonts/IBM-Plex-OFL.txt

      - name: Build smoke engine overlay
        run: |
          set -euo pipefail
          mkdir -p build-korean-overlay/data_tables/english
          cp korean/smoke/engine/data_tables/english/pc_names.txt \
            build-korean-overlay/data_tables/english/pc_names.txt
          mkdir -p dist/korean-smoke
          (cd build-korean-overlay && zip -9 -r ../dist/korean-smoke/engine.zip .)
          unzip -Z1 dist/korean-smoke/engine.zip > dist/korean-smoke/contents.txt
          grep -Fxq 'fonts/KoreanFallback.ttf' dist/korean-smoke/contents.txt
          grep -Fxq 'fonts/IBM-Plex-OFL.txt' dist/korean-smoke/contents.txt
          grep -Fxq 'data_tables/english/pc_names.txt' dist/korean-smoke/contents.txt
          (cd dist/korean-smoke && sha256sum engine.zip > engine.zip.sha256)

      - name: Upload Korean smoke overlay
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-korean-smoke-overlay
          path: |
            dist/korean-smoke/engine.zip
            dist/korean-smoke/engine.zip.sha256
            dist/korean-smoke/contents.txt
          if-no-files-found: error
          retention-days: 3

  windows-x64:
    name: Windows x64 compile
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out source only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /cmake/
            /engine/
            /game/
            /packaging/windows/
            /tools/openyamm_shaderc_stubs.cpp

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: >-
          cmake -S . -B build-korean-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=ON
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF

      - name: Compile OpenYAMM
        run: cmake --build build-korean-windows --target openyamm --parallel 4

      - name: Collect x64 binary
        run: |
          mkdir -p dist/windows-x64
          executable="$(find build-korean-windows -type f -iname 'openyamm.exe' | head -n 1)"
          test -n "$executable"
          cp "$executable" dist/windows-x64/openyamm.exe

      - name: Upload x64 smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-korean-smoke-windows-x64
          path: dist/windows-x64/openyamm.exe
          if-no-files-found: error
          retention-days: 3

  android-arm64:
    name: Android arm64 native compile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENYAMM_ANDROID_VERSION_NAME: korean-smoke
      OPENYAMM_ANDROID_VERSION_CODE: "1"
      OPENYAMM_ANDROID_RELEASE_ABIS: arm64-v8a

    steps:
      - name: Check out source only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /settings.ini
            /cmake/
            /engine/
            /game/
            /android/
            /tools/openyamm_shaderc_stubs.cpp

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle.properties
            android/app/*.gradle

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build libgl1-mesa-dev libx11-dev libxext-dev

      - name: Configure host shader tools
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=OFF
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF
          -DSDL_ALSA=OFF
          -DSDL_JACK=OFF
          -DSDL_KMSDRM=OFF
          -DSDL_PIPEWIRE=OFF
          -DSDL_PULSEAUDIO=OFF
          -DSDL_SNDIO=OFF
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DSDL_WAYLAND=OFF
          -DSDL_X11=OFF

      - name: Build host shader compiler
        run: cmake --build build --target openyamm_shaderc --parallel 4

      - name: Compile Android arm64 native library
        working-directory: android
        run: ./gradlew :app:externalNativeBuildRelease --no-daemon

      - name: Collect arm64 native library
        run: |
          mkdir -p dist/android-arm64
          library="$(find android -type f -path '*/arm64-v8a/libmain.so' | head -n 1)"
          if [[ -z "$library" ]]; then
            echo "::error::arm64-v8a libmain.so was not found after a successful native build"
            find android -type f -name 'libmain.so' -print || true
            exit 1
          fi
          echo "Found Android native library: $library"
          cp "$library" dist/android-arm64/libmain.so

      - name: Upload arm64 smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-korean-smoke-android-arm64
          path: dist/android-arm64/libmain.so
          if-no-files-found: error
          retention-days: 3
