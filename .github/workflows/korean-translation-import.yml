name: Korean translation import

on:
  push:
    branches:
      - korean-localization
    paths:
      - "korean/tools/build_translation_catalog.py"
      - "korean/tools/extend_npc_dialogue_catalog.py"
      - "korean/tools/extend_misc_catalog.py"
      - "korean/tools/apply_catalog_overrides.py"
      - "korean/translations/**"
      - "korean/build_patch.py"
      - "korean/licenses/**"
      - ".github/workflows/korean-translation-import.yml"
      - "assets_dev/engine/data_tables/english/Global.txt"
      - "assets_dev/engine/data_tables/english/quests.txt"
      - "assets_dev/engine/data_tables/english/autonote.txt"
      - "assets_dev/engine/data_tables/english/spells.txt"
      - "assets_dev/engine/data_tables/english/awards.txt"
      - "assets_dev/engine/data_tables/items.txt"
      - "assets_dev/engine/data_tables/npc.txt"
      - "assets_dev/engine/data_tables/npc_greet.txt"
      - "assets_dev/engine/data_tables/npc_topic.txt"
      - "assets_dev/engine/data_tables/npc_topic_text.txt"
      - "assets_dev/engine/data_tables/map_stats.txt"
      - "assets_dev/engine/data_tables/monster_data.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-translations:
    name: Build Korean translation catalog and overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out OpenYAMM Korean branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /korean/
            /assets_dev/engine/data_tables/english/Global.txt
            /assets_dev/engine/data_tables/english/quests.txt
            /assets_dev/engine/data_tables/english/autonote.txt
            /assets_dev/engine/data_tables/english/spells.txt
            /assets_dev/engine/data_tables/english/awards.txt
            /assets_dev/engine/data_tables/items.txt
            /assets_dev/engine/data_tables/npc.txt
            /assets_dev/engine/data_tables/npc_greet.txt
            /assets_dev/engine/data_tables/npc_topic.txt
            /assets_dev/engine/data_tables/npc_topic_text.txt
            /assets_dev/engine/data_tables/map_stats.txt
            /assets_dev/engine/data_tables/monster_data.txt

      - name: Check out MMMerge Korean translation source
        uses: actions/checkout@v7
        with:
          repository: munument1/-KR-MMMerge
          ref: main
          path: _mmmerge
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Data/Text localization/KO_GlobalTxt.txt
            /Data/Text localization/KO_QuestsTxt.txt
            /Data/Text localization/KO_AutonoteTxt.txt
            /Data/Text localization/KO_SpellsTxt.txt
            /Data/Text localization/KO_ItemsTxt.txt
            /Data/Text localization/KO_NPCData.txt
            /Data/Text localization/KO_NPCGreet1.txt
            /Data/Text localization/KO_NPCGreet2.txt
            /Data/Text localization/KO_NPCTopic.txt
            /Data/Text localization/KO_NPCText.txt
            /Data/Text localization/KO_AwardsTxt.txt
            /Data/Text localization/KO_MapStats.txt
            /Data/Text localization/KO_Monsters.txt

      - name: Generate base JSON catalog and native overlay tables
        run: |
          set -euo pipefail
          python3 korean/tools/build_translation_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-placeholder-mismatch
          python3 -m json.tool korean/translations/catalog.json >/dev/null

      - name: Extend catalog with NPC dialogue
        run: |
          set -euo pipefail
          python3 korean/tools/extend_npc_dialogue_catalog.py \
            --mmmerge-root _mmmerge

      - name: Apply audited NPC dialogue overrides
        run: |
          set -euo pipefail
          python3 korean/tools/apply_catalog_overrides.py \
            --overrides korean/translations/dialogue_overrides.json \
            --fail-on-review

      - name: Extend catalog with awards map names and monsters
        run: |
          set -euo pipefail
          python3 korean/tools/extend_misc_catalog.py \
            --mmmerge-root _mmmerge
          python3 -m json.tool korean/translations/catalog.json >/dev/null

      - name: Add Korean fallback font to generated engine overlay
        run: |
          set -euo pipefail
          mkdir -p korean/overlay/engine/fonts
          curl --fail --location --retry 3 \
            --output korean/overlay/engine/fonts/KoreanFallback.ttf \
            https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-kr/fonts/complete/ttf/hinted/IBMPlexSansKR-Regular.ttf
          test -s korean/overlay/engine/fonts/KoreanFallback.ttf
          cp korean/licenses/IBM-Plex-OFL.txt korean/overlay/engine/fonts/IBM-Plex-OFL.txt

      - name: Build overlay-only patch package
        run: |
          set -euo pipefail
          python3 korean/build_patch.py --output dist/korean-translation-import
          unzip -Z1 dist/korean-translation-import/korean/engine.zip > dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'fonts/KoreanFallback.ttf' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/english/Global.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/english/quests.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/english/autonote.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/english/spells.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/english/awards.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/items.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/npc.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/npc_greet.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/npc_topic.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/npc_topic_text.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/map_stats.txt' dist/korean-translation-import/engine-contents.txt
          grep -Fxq 'data_tables/monster_data.txt' dist/korean-translation-import/engine-contents.txt

      - name: Print translation coverage and review queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('korean/translations/catalog.json').read_text(encoding='utf-8'))
          print(json.dumps(data['summary'], ensure_ascii=False, indent=2))
          for table in data['tables']:
              suffix = ''
              if table.get('excluded'):
                  suffix = f", {table['excluded']} out-of-scope row(s) excluded"
              print(
                  table['source_file'],
                  table['translated'], '/', table['entries'], 'translated,',
                  table['untranslated'], 'untranslated,',
                  table['placeholder_mismatches'], 'placeholder mismatch(es),',
                  table['overrides'], 'override(s)' + suffix
              )

          review_entries = [
              entry for entry in data['entries']
              if entry['status'] in {'untranslated', 'needs_review'}
          ]
          print(f'REVIEW_QUEUE={len(review_entries)}')
          for entry in review_entries[:200]:
              print('---')
              print('key:', entry['key'])
              print('status:', entry['status'])
              print('source:', entry['source'])
              print('translation:', entry['translation'])
              print('placeholder_ok:', entry['placeholder_ok'])
          if len(review_entries) > 200:
              print(f'... {len(review_entries) - 200} additional review entries are in catalog.json')
          PY

      - name: Upload translation import artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-korean-translation-import
          path: |
            korean/translations/catalog.json
            korean/overlay/engine/data_tables/english/Global.txt
            korean/overlay/engine/data_tables/english/quests.txt
            korean/overlay/engine/data_tables/english/autonote.txt
            korean/overlay/engine/data_tables/english/spells.txt
            korean/overlay/engine/data_tables/english/awards.txt
            korean/overlay/engine/data_tables/items.txt
            korean/overlay/engine/data_tables/npc.txt
            korean/overlay/engine/data_tables/npc_greet.txt
            korean/overlay/engine/data_tables/npc_topic.txt
            korean/overlay/engine/data_tables/npc_topic_text.txt
            korean/overlay/engine/data_tables/map_stats.txt
            korean/overlay/engine/data_tables/monster_data.txt
            dist/korean-translation-import/korean/engine.zip
            dist/korean-translation-import/manifest.json
            dist/korean-translation-import/SHA256SUMS.txt
            dist/korean-translation-import/engine-contents.txt
          if-no-files-found: error
          retention-days: 7
