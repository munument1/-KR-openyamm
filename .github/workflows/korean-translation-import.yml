name: Korean translation import

on:
  push:
    branches:
      - korean-localization
    paths:
      - "korean/**"
      - "game/items/ItemEnchantTables.cpp"
      - "game/tables/CharacterInspectTable.cpp"
      - "assets_dev/engine/data_tables/**"
      - "assets_dev/worlds/mm6/_legacy/events/**"
      - "assets_dev/worlds/mm6/events/maps/**"
      - "assets_dev/worlds/mm7/_legacy/events/**"
      - "assets_dev/worlds/mm7/events/maps/**"
      - "assets_dev/worlds/mm8/_legacy/events/**"
      - "assets_dev/worlds/mm8/events/maps/**"
      - "assets_dev/worlds/mmmerge/events/maps/**"
      - ".github/workflows/korean-translation-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-translations:
    name: Build Korean translation catalog and overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out OpenYAMM Korean branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /korean/**
            /assets_dev/engine/data_tables/**
            /assets_dev/worlds/mm6/_legacy/events/**
            /assets_dev/worlds/mm6/events/maps/**
            /assets_dev/worlds/mm7/_legacy/events/**
            /assets_dev/worlds/mm7/events/maps/**
            /assets_dev/worlds/mm8/_legacy/events/**
            /assets_dev/worlds/mm8/events/maps/**
            /assets_dev/worlds/mmmerge/events/maps/**

      - name: Check out MMMerge Korean translation source
        uses: actions/checkout@v7
        with:
          repository: munument1/-KR-MMMerge
          ref: main
          path: _mmmerge
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Data/Text localization/**

      - name: Generate base JSON catalog and native overlay tables
        run: |
          set -euo pipefail
          python3 korean/tools/build_translation_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-placeholder-mismatch

      - name: Extend catalog with random NPC names
        run: |
          set -euo pipefail
          python3 korean/tools/extend_npc_names_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-review

      - name: Extend catalog with NPC dialogue
        run: |
          set -euo pipefail
          python3 korean/tools/extend_npc_dialogue_catalog.py \
            --mmmerge-root _mmmerge

      - name: Apply audited NPC dialogue overrides
        run: |
          set -euo pipefail
          python3 korean/tools/apply_catalog_overrides.py \
            --overrides korean/translations/dialogue_overrides.json \
            --fail-on-review

      - name: Extend catalog with awards map names and monsters
        run: |
          set -euo pipefail
          python3 korean/tools/extend_misc_catalog.py \
            --mmmerge-root _mmmerge

      - name: Apply audited misc overrides
        run: |
          set -euo pipefail
          python3 korean/tools/apply_catalog_overrides.py \
            --overrides korean/translations/misc_overrides.json \
            --fail-on-review

      - name: Extend catalog with placed monster names
        run: |
          set -euo pipefail
          python3 korean/tools/extend_place_mon_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-review

      - name: Extend catalog with reviewed stat and skill text
        run: |
          set -euo pipefail
          python3 korean/tools/extend_stats_skills_catalog.py \
            --fail-on-review

      - name: Extend catalog with scrolls and classes
        run: |
          set -euo pipefail
          python3 korean/tools/extend_legacy_text_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-review

      - name: Preserve class logic keys and localized display names
        run: |
          set -euo pipefail
          python3 korean/tools/normalize_class_overlay.py

      - name: Extend catalog with 2D event house text
        run: |
          set -euo pipefail
          python3 korean/tools/extend_house_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-review

      - name: Extend catalog with NPC news and profession labels
        run: |
          set -euo pipefail
          python3 korean/tools/extend_npc_runtime_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-review

      - name: Extend catalog with transitions and histories
        run: |
          set -euo pipefail
          python3 korean/tools/extend_transition_history_catalog.py \
            --mmmerge-root _mmmerge

      - name: Apply audited transition and history overrides
        run: |
          set -euo pipefail
          python3 korean/tools/apply_catalog_overrides.py \
            --overrides korean/translations/transition_history_overrides.json \
            --fail-on-review

      - name: Extend catalog with item enchant display text
        run: |
          set -euo pipefail
          python3 korean/tools/extend_item_enchant_catalog.py \
            --mmmerge-root _mmmerge \
            --fail-on-review

      - name: Generate Korean map event overlays
        run: |
          set -euo pipefail
          python3 korean/tools/build_map_string_overlays.py \
            --mmmerge-root _mmmerge \
            --fail-on-review
          python3 -m json.tool korean/translations/catalog.json >/dev/null

      - name: Add Korean fallback font to generated engine overlay
        run: |
          set -euo pipefail
          mkdir -p korean/overlay/engine/fonts
          curl --fail --location --retry 3 \
            --output korean/overlay/engine/fonts/KoreanFallback.ttf \
            https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-kr/fonts/complete/ttf/hinted/IBMPlexSansKR-Regular.ttf
          test -s korean/overlay/engine/fonts/KoreanFallback.ttf
          cp korean/licenses/IBM-Plex-OFL.txt korean/overlay/engine/fonts/IBM-Plex-OFL.txt

      - name: Build overlay-only patch package
        run: |
          set -euo pipefail
          python3 korean/build_patch.py --output dist/korean-translation-import
          unzip -Z1 dist/korean-translation-import/korean/engine.zip > dist/korean-translation-import/engine-contents.txt
          for required in \
            fonts/KoreanFallback.ttf \
            data_tables/english/Global.txt \
            data_tables/english/quests.txt \
            data_tables/english/autonote.txt \
            data_tables/english/spells.txt \
            data_tables/english/awards.txt \
            data_tables/english/scroll.txt \
            data_tables/english/class.txt \
            data_tables/english/trans.txt \
            data_tables/english/mm7_history.txt \
            data_tables/english/history.txt \
            data_tables/english/place_mon.txt \
            data_tables/english/stats.txt \
            data_tables/english/skill_des.txt \
            data_tables/items.txt \
            data_tables/npc.txt \
            data_tables/npc_names.txt \
            data_tables/npc_greet.txt \
            data_tables/npc_topic.txt \
            data_tables/npc_topic_text.txt \
            data_tables/npc_news.txt \
            data_tables/npc_professions.txt \
            data_tables/map_stats.txt \
            data_tables/monster_data.txt \
            data_tables/house_data.txt \
            data_tables/standard_item_enchants.txt \
            data_tables/special_item_enchants.txt; do
            grep -Fxq "$required" dist/korean-translation-import/engine-contents.txt
          done
          for world in mm6 mm7 mm8 mmmerge; do
            test -s "dist/korean-translation-import/korean/worlds/${world}.zip"
            echo "${world}: $(unzip -Z1 "dist/korean-translation-import/korean/worlds/${world}.zip" | wc -l) overlay file(s)"
          done
          unzip -Z1 dist/korean-translation-import/korean/worlds/mm6.zip | grep -Fxq 'events/maps/6d02.lua'

      - name: Print translation coverage and review queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('korean/translations/catalog.json').read_text(encoding='utf-8'))
          print(json.dumps(data['summary'], ensure_ascii=False, indent=2))
          for table in data['tables']:
              suffix = ''
              if table.get('excluded'):
                  suffix = f", {table['excluded']} excluded"
              print(
                  table['source_file'],
                  table['translated'], '/', table['entries'], 'translated,',
                  table['untranslated'], 'untranslated,',
                  table['placeholder_mismatches'], 'review,',
                  table['overrides'], 'override(s)' + suffix
              )

          review_entries = [
              entry for entry in data['entries']
              if entry['status'] in {'untranslated', 'needs_review'}
          ]
          print(f'REVIEW_QUEUE={len(review_entries)}')
          for entry in review_entries[:250]:
              print('---')
              print('key:', entry['key'])
              print('status:', entry['status'])
              print('source:', entry['source'])
              print('translation:', entry['translation'])
              print('note:', entry.get('note', ''))
          if len(review_entries) > 250:
              print(f'... {len(review_entries) - 250} additional review entries are in catalog.json')
          PY

      - name: Upload translation import artifact
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-korean-translation-import
          path: |
            korean/translations/catalog.json
            korean/overlay/engine/**
            korean/overlay/worlds/mm6/events/maps/
            korean/overlay/worlds/mm7/events/maps/
            korean/overlay/worlds/mm8/events/maps/
            korean/overlay/worlds/mmmerge/events/maps/
            dist/korean-translation-import/korean/engine.zip
            dist/korean-translation-import/korean/worlds/*.zip
            dist/korean-translation-import/manifest.json
            dist/korean-translation-import/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
