name: Korean translation import

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-translation-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-stone-to-flesh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OpenYAMM Korean branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Correct Stone to Flesh PO entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('korean/translations/ko.po')
          text = path.read_text(encoding='utf-8')
          context = 'msgctxt "engine:items.txt:262:Notes"'
          if text.count(context) != 1:
              raise SystemExit(f'expected exactly one {context!r}')
          start = text.index(context)
          end = text.find('\n\n', start)
          if end < 0:
              end = len(text)
          block = text[start:end]
          if 'Cures Stoned.' not in block:
              raise SystemExit('unexpected Stone to Flesh English source')
          wrong = '취한 상태를 치료합니다.'
          correct = '석화 상태를 치료합니다.'
          if wrong in block:
              block = block.replace(wrong, correct, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')
              print('OpenYAMM Stone to Flesh PO translation corrected.')
          elif correct in block:
              print('OpenYAMM Stone to Flesh PO translation already corrected.')
          else:
              raise SystemExit('unexpected Korean Stone to Flesh translation')
          verify = path.read_text(encoding='utf-8')
          pos = verify.index(context)
          end = verify.find('\n\n', pos)
          if end < 0:
              end = len(verify)
          final_block = verify[pos:end]
          if correct not in final_block or wrong in final_block:
              raise SystemExit('OpenYAMM Stone to Flesh PO verification failed')
          PY

      - name: Commit corrected PO
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- korean/translations/ko.po; then
            echo 'PO already corrected.'
            exit 0
          fi
          git diff --check -- korean/translations/ko.po
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add korean/translations/ko.po
          git commit -m 'Fix Stone to Flesh potion description'
          git push origin HEAD:korean-localization
