name: Temporary cleanup Korean runtime localization validation

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/korean-runtime-field-fix-retry4-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: true

      - name: Remove temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch \
            .github/workflows/korean-runtime-field-fix-temp.yml \
            .github/workflows/korean-runtime-field-fix-retry-temp.yml \
            .github/workflows/korean-runtime-field-fix-retry2-temp.yml \
            .github/workflows/korean-runtime-field-fix-retry3-temp.yml \
            .github/workflows/korean-runtime-field-fix-retry4-temp.yml \
            korean/.runtime-localization-validation-trigger
          git diff --cached --check
          git commit -m 'Remove temporary runtime localization workflows'
          git push origin HEAD:korean-localization
