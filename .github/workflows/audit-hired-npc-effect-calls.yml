name: One-shot hired NPC effect call audit

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/audit-hired-npc-effect-calls.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/**
      - name: Trace cross-map travel route
        shell: bash
        run: |
          set -euo pipefail
          echo '=== cross-map helper ==='
          grep -RIn 'hiredNpcCrossMapDayReduction' game || true
          echo '=== likely outdoor transition/travel code ==='
          grep -RIn -E 'travelDays|travelDay|travelTime|TravelTime|daysToTravel|transition.*day|day.*transition|MapTransition|map transition|CrossMap|cross-map|cross map' game | head -n 500 || true
          echo '=== time advances around map transitions ==='
          grep -RIn -E 'advance.*(Day|day|Time|time)|add.*(Day|day|Hour|hour)|gameMinutes|hours' game/gameplay game/outdoor game/events | grep -E 'transition|travel|map|Outdoor|outdoor' | head -n 500 || true
