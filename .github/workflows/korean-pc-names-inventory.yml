name: Korean PC names inventory

on:
  push:
    branches:
      - korean-localization
    paths:
      - .github/workflows/korean-pc-names-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korean-pc-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenYAMM Korean name sources
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets_dev/engine/data_tables/english/pc_names.txt
            /assets_dev/engine/data_tables/npc_names.txt
            /korean/translations/pc_names_inventory.json

      - name: Check out MMMerge Korean name source
        uses: actions/checkout@v7
        with:
          repository: munument1/-KR-MMMerge
          ref: main
          path: _mmmerge
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Data/Text localization/KO_NPCNames.txt

      - name: Rebuild and verify source-only PC name inventory
        shell: bash
        run: |
          set -euo pipefail
          cp korean/translations/pc_names_inventory.json /tmp/pc_names_inventory.tracked.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('assets_dev/engine/data_tables/english/pc_names.txt')
          lines = source_path.read_text(encoding='utf-8-sig').splitlines()
          if not lines:
              raise SystemExit('pc_names.txt is empty')

          categories = [
              'human_male', 'human_female', 'dark_elf_male', 'dark_elf_female',
              'troll_minotaur', 'vampire_female', 'vampire_male', 'dragon'
          ]
          entries = []
          unique = []
          seen = set()
          counts = {category: 0 for category in categories}

          for row_index, line in enumerate(lines[1:], start=1):
              cells = line.split('\t')
              cells += [''] * max(0, 8 - len(cells))
              for column, category in enumerate(categories):
                  source = cells[column].strip()
                  if not source or source == '*end':
                      continue
                  entries.append({
                      'row': row_index,
                      'column': column,
                      'category': category,
                      'source': source,
                  })
                  counts[category] += 1
                  if source not in seen:
                      seen.add(source)
                      unique.append(source)

          out = {
              'format': 1,
              'source_file': str(source_path),
              'source_blob_sha256_note': 'source drift is validated by exact row/column/source in the final importer',
              'categories': categories,
              'counts': counts,
              'entry_count': len(entries),
              'unique_source_count': len(unique),
              'entries': entries,
              'unique_sources': unique,
          }
          Path('korean/translations/pc_names_inventory.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('entry_count=', len(entries))
          print('unique_source_count=', len(unique))
          print('counts=', counts)
          PY
          cmp -s /tmp/pc_names_inventory.tracked.json korean/translations/pc_names_inventory.json || {
            echo 'Tracked PC name inventory is stale.' >&2
            diff -u /tmp/pc_names_inventory.tracked.json korean/translations/pc_names_inventory.json | head -200
            exit 1
          }

      - name: Build verified reuse candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pc-name-review
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          def read_text_with_encodings(path, encodings):
              raw = Path(path).read_bytes()
              for encoding in encodings:
                  try:
                      return raw.decode(encoding), encoding
                  except UnicodeDecodeError:
                      pass
              raise SystemExit(f'Could not decode {path} with {encodings}')

          inventory = json.loads(Path('korean/translations/pc_names_inventory.json').read_text(encoding='utf-8'))
          english_text, english_encoding = read_text_with_encodings(
              'assets_dev/engine/data_tables/npc_names.txt', ('utf-8-sig', 'cp1252'))
          korean_text, korean_encoding = read_text_with_encodings(
              '_mmmerge/Data/Text localization/KO_NPCNames.txt', ('utf-8-sig', 'cp949'))
          english_lines = english_text.splitlines()
          korean_lines = korean_text.splitlines()

          if not english_lines or english_lines[0].split('\t')[:2] != ['Male', 'Female']:
              raise SystemExit('Unexpected English NPC name header')
          if not korean_lines or korean_lines[0].split('\t')[:2] != ['Male', 'Female']:
              raise SystemExit('Unexpected Korean NPC name header')
          if len(english_lines) not in (len(korean_lines), len(korean_lines) + 1):
              raise SystemExit(
                  f'NPC name row count mismatch: English={len(english_lines)} Korean={len(korean_lines)}')
          if len(english_lines) == len(korean_lines) + 1:
              trailing_cells = english_lines[-1].split('\t')
              if not trailing_cells or trailing_cells[0].strip() != 'Zyggie':
                  raise SystemExit(
                      f'Unexpected unmatched English NPC row: {english_lines[-1]!r}')
              print('legacy_missing_trailing_source=', trailing_cells[0].strip())

          print('english_npc_names_encoding=', english_encoding)
          print('korean_npc_names_encoding=', korean_encoding)

          evidence = defaultdict(list)
          for row_index, (english_line, korean_line) in enumerate(zip(english_lines[1:], korean_lines[1:]), start=1):
              english_cells = english_line.split('\t')
              korean_cells = korean_line.split('\t')
              english_cells += [''] * max(0, 2 - len(english_cells))
              korean_cells += [''] * max(0, 2 - len(korean_cells))
              for column, sex in ((0, 'male'), (1, 'female')):
                  source = english_cells[column].strip()
                  translation = korean_cells[column].strip()
                  if not source or not translation:
                      continue
                  evidence[source].append({
                      'translation': translation,
                      'row': row_index,
                      'column': column,
                      'sex': sex,
                  })

          resolved = {}
          conflicts = {}
          for source, items in evidence.items():
              translations = sorted({item['translation'] for item in items})
              if len(translations) == 1:
                  resolved[source] = {
                      'translation': translations[0],
                      'evidence': items,
                  }
              else:
                  conflicts[source] = {
                      'translations': translations,
                      'evidence': items,
                  }

          entries = {}
          reused = 0
          pending = 0
          for source in inventory['unique_sources']:
              if source in resolved:
                  reused += 1
                  entries[source] = {
                      'source': source,
                      'translation': resolved[source]['translation'],
                      'reviewed': True,
                      'origin': 'verified_mmmerge_npc_name_exact',
                      'evidence': resolved[source]['evidence'],
                  }
              else:
                  pending += 1
                  entries[source] = {
                      'source': source,
                      'translation': '',
                      'reviewed': False,
                      'origin': 'direct_review_pending',
                  }

          out = {
              'format': 1,
              'source_file': inventory['source_file'],
              'review_status': 'candidate',
              'review_note': 'Exact English-name matches reuse the already reviewed MMMerge KO_NPCNames rendering. Unmatched names require direct Korean transliteration and review.',
              'unique_source_count': inventory['unique_source_count'],
              'reused_verified_count': reused,
              'direct_review_pending_count': pending,
              'conflicting_verified_source_count': len(conflicts),
              'conflicts': conflicts,
              'entries': entries,
          }
          out_path = Path('dist/pc-name-review/pc_names_review_candidates.json')
          out_path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('unique_source_count=', inventory['unique_source_count'])
          print('reused_verified_count=', reused)
          print('direct_review_pending_count=', pending)
          print('conflicting_verified_source_count=', len(conflicts))
          print('pending_sources:')
          for source, spec in entries.items():
              if not spec['reviewed']:
                  print(source)
          PY
          python3 -m json.tool dist/pc-name-review/pc_names_review_candidates.json >/dev/null

      - name: Upload PC name review candidates
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-pc-name-review-candidates
          path: dist/pc-name-review/pc_names_review_candidates.json
          if-no-files-found: error
          retention-days: 7
