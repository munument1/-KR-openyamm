name: Temporary apply Korean runtime field localization fix

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-runtime-field-fix-temp.yml"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out OpenYAMM Korean branch
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: true

      - name: Check out MMMerge Korean translation source
        uses: actions/checkout@v7
        with:
          repository: munument1/-KR-MMMerge
          ref: main
          path: _mmmerge
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Data/Text localization/**

      - name: Apply source and PO fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          payload = ''
          with open('/tmp/apply_runtime_fix.py', 'wb') as stream:
              stream.write(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/apply_runtime_fix.py
          python3 -m py_compile \
            korean/tools/extend_map_runtime_catalog.py \
            korean/tools/sync_map_target_names.py \
            korean/tools/test_map_runtime_po.py \
            korean/tools/test_sync_map_target_names.py \
            korean/build_patch.py
          git diff --check

      - name: Test focused Python localization paths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            korean/tools/test_map_runtime_po.py \
            korean/tools/test_sync_map_target_names.py \
            korean/tools/test_catalog_po.py

      - name: Build and validate full Korean overlay
        shell: bash
        run: |
          set -euo pipefail
          bash korean/build_release_overlay.sh _mmmerge dist/runtime-localization-fix

          unzip -p dist/runtime-localization-fix/korean/engine.zip \
            data_tables/npc_topic_text.txt > /tmp/npc_topic_text.txt
          grep -Fq '다데로스는 원팽 리자드맨 부족과 토버스크 열매를 거래하기 위해' /tmp/npc_topic_text.txt
          if grep -Fq 'Dadeross led us here to trade with the Lizardman Clan of Onefang' /tmp/npc_topic_text.txt; then
            echo '::error::reported NPC dialogue is still English in final engine.zip'
            exit 1
          fi

          unzip -p dist/runtime-localization-fix/korean/worlds/mm8.zip \
            events/maps/out01.lua > /tmp/mm8-out01.lua
          grep -Fq '"우물물을 마십니다."' /tmp/mm8-out01.lua
          grep -Fq '"지능 +15 (일시적)"' /tmp/mm8-out01.lua
          grep -Fq '"상쾌합니다."' /tmp/mm8-out01.lua
          grep -Fq '"히스의 오두막"' /tmp/mm8-out01.lua
          if grep -Fq '"Drink from the well"' /tmp/mm8-out01.lua; then
            echo '::error::MM8 well interaction title is still English'
            exit 1
          fi
          if grep -Fq '"Hiss'"'"' Hut"' /tmp/mm8-out01.lua; then
            echo '::error::MM8 building event title is still English'
            exit 1
          fi

          unzip -p dist/runtime-localization-fix/korean/engine.zip \
            data_tables/map_stats.txt > /tmp/map_stats.txt
          grep -Fq '대거운드 섬' /tmp/map_stats.txt

      - name: Commit validated localization fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            engine/AssetFileSystem.cpp \
            tests/AssetFileSystemTests.cpp \
            korean/build_patch.py \
            korean/tools/extend_map_runtime_catalog.py \
            korean/tools/sync_map_target_names.py \
            korean/tools/test_map_runtime_po.py \
            korean/tools/test_sync_map_target_names.py \
            korean/translations/ko.po \
            korean/.runtime-localization-validation-trigger
          git diff --cached --check
          git commit -m 'Route field runtime text through Korean PO'
          git push origin HEAD:korean-localization
