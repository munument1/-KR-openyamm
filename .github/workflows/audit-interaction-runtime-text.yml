name: One-shot interaction runtime text audit

on:
  push:
    branches: [korean-localization]
    paths: [".github/workflows/audit-interaction-runtime-text.yml"]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit interaction runtime text coverage'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets_dev/worlds/mm6/events/**
            /assets_dev/worlds/mm7/events/**
            /assets_dev/worlds/mm8/events/**
            /assets_dev/worlds/mmmerge/events/**
            /assets_dev/worlds/mm6/_legacy/events/**
            /assets_dev/worlds/mm7/_legacy/events/**
            /assets_dev/worlds/mm8/_legacy/events/**
            /game/events/**
            /game/gameplay/**
            /game/ui/**
            /korean/**
      - name: Audit well object sign and stat runtime strings
        shell: bash
        run: |
          set -euo pipefail
          echo '===== WELL / FOUNTAIN / KEG / ANVIL / SIGN / SHRINE / OBELISK ====='
          grep -RInE --include='*.lua' --include='*.cpp' --include='*.h' --include='*.txt' --include='*.json' \
            '\b(Well|Fountain|Keg|Anvil|Sign|Shrine|Obelisk)\b|well|fountain|keg|anvil|sign|shrine|obelisk' \
            assets_dev/worlds game korean | head -n 1200 || true
          echo '===== STAT / STATUS WORDING ====='
          grep -RInE --include='*.lua' --include='*.cpp' --include='*.h' --include='*.txt' --include='*.json' \
            '\b(Might|Intellect|Personality|Endurance|Accuracy|Speed|Luck)\b|gains? \+?[0-9]+|permanently|temporary|temporarily' \
            assets_dev/worlds game korean | head -n 1200 || true
          echo '===== MESSAGE / STATUS / HINT SITES IN MAP EVENTS ====='
          grep -RInE --include='*.lua' \
            'Status|status|Message|message|Hint|hint|Txt|txt|Text|text|SetMessage|SetStatus|Show' \
            assets_dev/worlds/mm6/events/maps assets_dev/worlds/mm7/events/maps assets_dev/worlds/mm8/events/maps assets_dev/worlds/mmmerge/events/maps | \
            head -n 1600 || true
