name: Temporary Korean cutscene coverage finalizer

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-cutscene-asr-final-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-reviewed-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out latest Korean branch
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1

      - name: Finalize reviewed cutscene coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          coverage_path = Path('korean/subtitles/coverage.json')
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))

          no_dialogue = {
              ('mm6', '6losegame'),
              ('mm6', 'credits'),
              ('mm6', 'mm6end2'),
              ('mm7', 'endgame 2 evil'),
              ('mm8', 'intro'),
              ('mm8', 'JVC'),
              ('mm8', 'LoseGame'),
              ('mm8', 'nightshade'),
              ('mm8', 'NWC'),
              ('mm8', 'SaveMino'),
              ('mm8', 'Subcut'),
          }
          ready = {
              ('mm7', 'intro post'): ['korean/overlay/worlds/mm7/subtitles/intro post.srt'],
              ('mm8', 'DragonHunters'): ['korean/overlay/worlds/mm8/subtitles/DragonHunters.srt'],
              ('mm8', 'dragonsrevenge'): ['korean/overlay/worlds/mm8/subtitles/dragonsrevenge.srt'],
              ('mm8', 'wingame'): ['korean/overlay/worlds/mm8/subtitles/wingame.srt'],
          }

          for entry in coverage['entries']:
              key = (entry['world'], entry['stem'])
              if key in no_dialogue:
                  entry['status'] = 'no_dialogue'
                  entry['reason'] = (
                      'Runtime OGV frames and repeated speech-audit passes confirm '
                      'music/effects/visual-only content with no spoken dialogue requiring subtitles.'
                  )
                  entry['subtitle_files'] = []
              elif key in ready:
                  for subtitle in ready[key]:
                      if not Path(subtitle).is_file():
                          raise SystemExit(f'Missing reviewed subtitle: {subtitle}')
                  entry['status'] = 'subtitle_ready'
                  entry['subtitle_files'] = ready[key]
                  if key == ('mm7', 'intro post'):
                      entry['reason'] = (
                          'Speech was cross-checked across base.en, medium.en, and large-v3 ASR '
                          'with runtime frames and game context; Korean SRT uses reviewed timing '
                          'and established terminology.'
                      )
                  elif key == ('mm8', 'DragonHunters'):
                      entry['reason'] = (
                          'Speech was cross-checked across independent ASR passes and runtime frames; '
                          'the alliance/Dragon Hunter context was verified against game dialogue.'
                      )
                  elif key == ('mm8', 'dragonsrevenge'):
                      entry['reason'] = (
                          'Low-confidence base ASR was resolved by medium.en and large-v3 agreement '
                          'plus runtime-frame review; the SRT uses only corroborated spoken lines.'
                      )
                  else:
                      entry['reason'] = (
                          'The closing spoken line was independently corroborated and timed against '
                          'the runtime ending movie before Korean subtitle authoring.'
                      )
              elif key == ('mm8', 'skeltrans'):
                  entry['status'] = 'review_required'
                  entry['reason'] = (
                      'The main speech is clear, but the final short utterance remains ambiguous '
                      'across independent large-v3 decoding settings; no guessed SRT is published.'
                  )
                  entry['subtitle_files'] = []

          coverage['policy'] = [
              'Every runtime OGV must appear exactly once in this file.',
              'subtitle_ready means a Korean SRT is committed and package-tested.',
              'no_audio is reserved for media with no audio stream.',
              'no_dialogue is reserved for reviewed media whose audio contains music/effects but no spoken dialogue requiring subtitles.',
              'review_required means no subtitle text is guessed from filenames or unresolved/low-confidence speech.',
          ]
          coverage['summary'] = {
              'runtime_videos': len(coverage['entries']),
              'subtitle_ready': sum(e['status'] == 'subtitle_ready' for e in coverage['entries']),
              'no_audio': sum(e['status'] == 'no_audio' for e in coverage['entries']),
              'no_dialogue': sum(e['status'] == 'no_dialogue' for e in coverage['entries']),
              'review_required': sum(e['status'] == 'review_required' for e in coverage['entries']),
          }
          expected = {
              'runtime_videos': 32,
              'subtitle_ready': 18,
              'no_audio': 2,
              'no_dialogue': 11,
              'review_required': 1,
          }
          if coverage['summary'] != expected:
              raise SystemExit(f"Unexpected coverage summary: {coverage['summary']} != {expected}")
          coverage_path.write_text(json.dumps(coverage, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('korean/subtitles/README.md')
          text = readme_path.read_text(encoding='utf-8')
          old = '''- `subtitle_ready`: a reviewed Korean SRT is committed and package-tested.\n- `no_audio`: `ffprobe` found no audio stream, so no SRT is required.\n- `review_required`: speech or audio exists, but the transcript/timing is not\n  reliable enough yet to publish a subtitle.\n\nThe first two reviewed batches classify all 32 runtime OGV files: 14 are\n`subtitle_ready`, 2 are confirmed `no_audio`, and 16 remain `review_required`.\nThe review-required entries stay explicit instead of being silently treated as\ncomplete translation coverage.\n'''
          new = '''- `subtitle_ready`: a reviewed Korean SRT is committed and package-tested.\n- `no_audio`: `ffprobe` found no audio stream, so no SRT is required.\n- `no_dialogue`: the runtime movie was manually reviewed and contains\n  music/effects/visuals but no spoken dialogue requiring subtitles.\n- `review_required`: speech exists, but the transcript/timing is not reliable\n  enough yet to publish a complete subtitle.\n\nThe current reviewed inventory classifies all 32 runtime OGV files: 18 are\n`subtitle_ready`, 2 are confirmed `no_audio`, 11 are confirmed `no_dialogue`,\nand 1 remains `review_required` (`mm8/skeltrans`). The unresolved entry stays\nexplicit because its final short utterance remains ambiguous across independent\nASR decoding settings; no wording is guessed merely to make the review count\nreach zero.\n'''
          if old not in text:
              raise SystemExit('README coverage block no longer matches expected source; refusing blind replacement.')
          text = text.replace(old, new)
          text = text.replace(
              'but low-confidence or missing ASR is never converted into guessed\nKorean subtitle text.',
              'but low-confidence or conflicting ASR is never converted into guessed\nKorean subtitle text.',
          )
          readme_path.write_text(text, encoding='utf-8')
          print('CUTSCENE_COVERAGE=' + json.dumps(coverage['summary'], sort_keys=True))
          PY

      - name: Test finalized subtitle integration
        run: python3 -m unittest korean/tools/test_cutscene_subtitles.py

      - name: Commit finalized coverage
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korean/subtitles/coverage.json korean/subtitles/README.md
          git diff --cached --check
          git commit -m "Finalize reviewed cutscene subtitle coverage"
          git push origin HEAD:korean-localization
