name: Temporary Korean cutscene final ASR review

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/korean-cutscene-asr-final-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-skeltrans-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out skeltrans runtime movie
        uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets_dev/worlds/mm8/videos/Cutscenes/skeltrans.ogv

      - name: Install ASR tools
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir faster-whisper

      - name: Decode skeltrans under independent settings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          path = Path('assets_dev/worlds/mm8/videos/Cutscenes/skeltrans.ogv')
          model = WhisperModel('large-v3', device='cpu', compute_type='int8')
          configs = [
              {'name': 'vad_independent', 'vad_filter': True, 'condition_on_previous_text': False, 'beam_size': 5},
              {'name': 'no_vad_context', 'vad_filter': False, 'condition_on_previous_text': True, 'beam_size': 5},
              {'name': 'no_vad_independent_beam10', 'vad_filter': False, 'condition_on_previous_text': False, 'beam_size': 10},
          ]
          records = []
          for config in configs:
              segments, info = model.transcribe(
                  str(path), language='en', word_timestamps=True,
                  vad_filter=config['vad_filter'],
                  condition_on_previous_text=config['condition_on_previous_text'],
                  beam_size=config['beam_size'],
              )
              out = []
              for segment in segments:
                  words = [
                      {'start': round(float(w.start), 3), 'end': round(float(w.end), 3),
                       'text': w.word, 'probability': round(float(w.probability), 4)}
                      for w in (segment.words or [])
                  ]
                  out.append({'start': round(float(segment.start), 3), 'end': round(float(segment.end), 3),
                              'text': segment.text.strip(), 'words': words})
              records.append({'config': config, 'segments': out})
              print('\nCONFIG', config['name'])
              for segment in out:
                  print(f"{segment['start']:.3f}-{segment['end']:.3f}: {segment['text']}")
                  print([(w['text'], w['probability']) for w in segment['words']])

          Path('skeltrans-asr-resolution.json').write_text(
              json.dumps({'format': 1, 'model': 'faster-whisper large-v3', 'records': records}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload skeltrans resolution
        uses: actions/upload-artifact@v7
        with:
          name: korean-skeltrans-asr-resolution
          path: skeltrans-asr-resolution.json
          if-no-files-found: error
          retention-days: 1
