name: Temporary integrate event hover label sync
on:
  push:
    branches: [tmp-record-hover-fixes]
    paths: [".github/workflows/tmp-integrate-event-hover-sync.yml"]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Integrate event hover label sync'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-record-hover-fixes
          fetch-depth: 1
      - name: Wire packaging pass and validate full map vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('korean/build_patch.py')
          text=path.read_text(encoding='utf-8')
          old='        repo_root / "korean" / "tools" / "sync_map_target_names.py",\n'
          new=('        repo_root / "korean" / "tools" / "sync_map_event_labels.py",\n'
               '        repo_root / "korean" / "tools" / "sync_map_target_names.py",\n')
          if 'sync_map_event_labels.py' not in text:
              if old not in text: raise SystemExit('build_patch sync anchor missing')
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          PY
          python3 -m unittest korean.tools.test_sync_map_event_labels korean.tools.test_sync_map_target_names korean.tools.test_record_hover_localization -v
          python3 korean/tools/sync_map_event_labels.py --repo-root .
          python3 korean/tools/sync_map_target_names.py --repo-root .
          python3 - <<'PY'
          import re
          from pathlib import Path
          pat=re.compile(r'RegisterEvent\([^,\n]+,\s*"((?:\\.|[^"\\])*)"')
          latin=[]; total=0
          for p in sorted(Path('korean/overlay/worlds').glob('*/events/maps/*.lua')):
              text=p.read_text(encoding='utf-8')
              for m in pat.finditer(text):
                  total+=1
                  if re.search(r'[A-Za-z]',m.group(1)): latin.append((p,m.group(1)))
          print('overlay_RegisterEvent_labels',total,'latin_remaining',len(latin))
          for row in latin[:100]: print('LATIN',row[0],row[1])
          PY
          git checkout -- korean/overlay || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add korean/build_patch.py
          git commit -m 'fix(korean): localize map event hover labels'
          git push origin HEAD:tmp-record-hover-fixes
