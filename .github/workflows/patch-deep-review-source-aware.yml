name: One-shot source-aware terminology patcher

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/patch-deep-review-source-aware.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: korean-localization
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /korean/tools/apply_deep_review_corrections.py
            /korean/tools/test_deep_review_corrections.py
            /korean/translations/stats_skills_reviewed.json

      - name: Make terminology normalization source-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('korean/tools/apply_deep_review_corrections.py')
          text = path.read_text(encoding='utf-8')

          if 'import re\n' not in text:
              text = text.replace('import json\n', 'import json\nimport re\n', 1)

          helper_anchor = 'def item_context_corrections(source: str, translation: str, counts: Counter[str]) -> str:\n'
          helper = '''def source_has_word(source: str, word: str) -> bool:
              return re.search(r"\\b" + re.escape(word) + r"\\b", source) is not None


          def source_aware_terminology(
              source_name: str,
              source: str,
              translation: str,
              counts: Counter[str],
          ) -> str:
              result = translation
              for english, old, new in (
                  ("Intellect", "지력", "지능"),
                  ("Accuracy", "정확도", "적중률"),
                  ("Endurance", "인내력", "체력"),
                  ("Speed", "민첩성", "속도"),
              ):
                  if source_has_word(source, english):
                      result = replace_all(result, ((old, new),), counts)

              if source_name != "items.txt" and source_has_word(source, "Luck"):
                  result = replace_all(result, (("행운", "운"),), counts)
              if source_has_word(source, "Air"):
                  result = replace_all(result, (("대기", "공기"),), counts)
              if source_has_word(source, "Body"):
                  result = replace_all(result, (("신체", "육체"),), counts)
              if source_has_word(source, "Earth"):
                  result = replace_all(result, (("흙 마법", "대지 마법"),), counts)
              if source_has_word(source, "Resistance") or source_has_word(source, "Resistances"):
                  result = replace_all(result, (("저항력", "저항"),), counts)
              return result


          '''
          if 'def source_aware_terminology(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('item_context_corrections function not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          call_anchor = '    corrected = replace_all(corrected, TABLE_REPLACEMENTS.get(source_name, ()), counts)\n\n    if source_name == "items.txt":\n'
          call_replacement = '    corrected = replace_all(corrected, TABLE_REPLACEMENTS.get(source_name, ()), counts)\n    corrected = source_aware_terminology(source_name, source, corrected, counts)\n\n    if source_name == "items.txt":\n'
          if 'corrected = source_aware_terminology(' not in text:
              if call_anchor not in text:
                  raise SystemExit('catalog correction call anchor not found')
              text = text.replace(call_anchor, call_replacement, 1)

          item_marker = '    (507, "Notes"): '
          if '(506, "Notes")' not in text:
              if item_marker not in text:
                  raise SystemExit('item 507 override marker not found')
              insertion = '    (506, "Notes"): "(체력 +20, 드래곤 사냥, 빠른 공격 회복 속도) 역대 최고의 드래곤 사냥꾼으로 손꼽히는 라이언 스메들리 경은 모든 원정에서 이 강력한 창을 휴대하며, 이 창만 있으면 어떤 드래곤과도 일대일로 싸워 이길 수 있다고 자부했습니다. 그의 주장은 사실이었지만, 결국 그는 섀도우매시 고개에서 매복 공격을 가한 12마리가 넘는 드래곤들에게 목숨을 잃었습니다.",\n'
              text = text.replace(item_marker, insertion + item_marker, 1)

          validate_anchor = '        source_name = Path(str(entry.get("source_file", ""))).name\n        if source_name == "items.txt":\n'
          validate_replacement = '''        source_name = Path(str(entry.get("source_file", ""))).name
              source = str(entry.get("source", ""))
              for english, stale in (
                  ("Intellect", "지력"),
                  ("Accuracy", "정확도"),
                  ("Endurance", "인내력"),
                  ("Speed", "민첩성"),
                  ("Air", "대기 마법"),
                  ("Air", "대기 저항"),
                  ("Body", "신체 마법"),
                  ("Body", "신체 저항"),
              ):
                  if source_has_word(source, english) and stale in translation:
                      errors.append(f"{entry.get('key', '<unknown>')}: stale {stale!r} for source term {english}")
              if source_name == "items.txt":
          '''
          if 'stale in (' not in text:
              if validate_anchor not in text:
                  raise SystemExit('validate_catalog source_name anchor not found')
              text = text.replace(validate_anchor, validate_replacement, 1)

          # Keep the generated items overlay byte-for-byte aligned with the
          # corrected catalog fields. This propagates source-aware fixes into
          # the actual game package instead of leaving them catalog-only.
          text = text.replace(
              'def correct_items_tsv(text: str) -> tuple[str, Counter[str]]:\n',
              'def correct_items_tsv(text: str, catalog_item_fields: dict[tuple[int, str], str] | None = None) -> tuple[str, Counter[str]]:\n',
              1,
          )
          sync_anchor = '''        # The generated TSV no longer carries the English note next to the
              # Korean note, so exact item overrides are authoritative here.
              for field, column in (("Name", name_column), ("Notes", notes_column)):
                  override = ITEM_FIELD_OVERRIDES.get((item_id, field))
                  if override is not None and row[column] != override:
                      row[column] = override
                      counts[f"item:{item_id}:{field}"] += 1
          '''
          sync_replacement = '''        # The generated TSV no longer carries the English note next to the
              # Korean note. Synchronize every reviewed catalog field first,
              # then retain exact overrides as a final authority.
              for field, column in (("Name", name_column), ("Notes", notes_column)):
                  catalog_value = (catalog_item_fields or {}).get((item_id, field))
                  if catalog_value is not None and row[column] != catalog_value:
                      row[column] = catalog_value
                      counts[f"catalog-sync:{item_id}:{field}"] += 1
                  override = ITEM_FIELD_OVERRIDES.get((item_id, field))
                  if override is not None and row[column] != override:
                      row[column] = override
                      counts[f"item:{item_id}:{field}"] += 1
          '''
          if 'catalog-sync:' not in text:
              if sync_anchor not in text:
                  raise SystemExit('items TSV sync anchor not found')
              text = text.replace(sync_anchor, sync_replacement, 1)

          text = text.replace(
              'def correct_overlay_text(path: Path, text: str) -> tuple[str, Counter[str]]:\n',
              'def correct_overlay_text(path: Path, text: str, catalog_item_fields: dict[tuple[int, str], str] | None = None) -> tuple[str, Counter[str]]:\n',
              1,
          )
          text = text.replace(
              '        return correct_items_tsv(text)\n',
              '        return correct_items_tsv(text, catalog_item_fields)\n',
              1,
          )

          mapping_anchor = '    validate_catalog(catalog)\n    catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n\n    overlay_paths: list[Path] = []\n'
          mapping_replacement = '''    validate_catalog(catalog)
              catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")

              catalog_item_fields: dict[tuple[int, str], str] = {}
              for entry in catalog.get("entries", []):
                  if Path(str(entry.get("source_file", ""))).name != "items.txt":
                      continue
                  try:
                      item_id = int(entry.get("record_id"))
                  except (TypeError, ValueError):
                      continue
                  field = str(entry.get("field", ""))
                  translation = entry.get("translation", "")
                  if field in {"Name", "Notes"} and isinstance(translation, str):
                      catalog_item_fields[(item_id, field)] = translation

              overlay_paths: list[Path] = []
          '''
          if 'catalog_item_fields: dict[' not in text:
              if mapping_anchor not in text:
                  raise SystemExit('catalog mapping anchor not found')
              text = text.replace(mapping_anchor, mapping_replacement, 1)

          text = text.replace(
              '        corrected, counts = correct_overlay_text(path, original)\n',
              '        corrected, counts = correct_overlay_text(path, original, catalog_item_fields)\n',
              1,
          )

          path.write_text(text, encoding='utf-8')

          reviewed = Path('korean/translations/stats_skills_reviewed.json')
          reviewed_text = reviewed.read_text(encoding='utf-8')
          reviewed_text = reviewed_text.replace('대기 피해', '공기 피해')
          reviewed_text = reviewed_text.replace('신체 피해', '육체 피해')
          reviewed.write_text(reviewed_text, encoding='utf-8')

          test_path = Path('korean/tools/test_deep_review_corrections.py')
          test = test_path.read_text(encoding='utf-8')
          test_anchor = '    def test_bulk_replacement_corruption_is_repaired(self) -> None:\n'
          addition = '''    def test_source_aware_stat_terms_survive_upstream_variants(self) -> None:
              samples = (
                  ("Endurance +20", "인내력 +20", "체력 +20"),
                  ("Speed +70", "민첩성 +70", "속도 +70"),
                  ("Pure Intellect", "순수한 지력", "순수한 지능"),
                  ("Pure Accuracy", "순수한 정확도", "순수한 적중률"),
                  ("Pure Luck", "순수한 행운", "순수한 운"),
                  ("Air Resistance", "대기 저항력", "공기 저항"),
                  ("Body Resistance", "신체 저항력", "육체 저항"),
              )
              for source, translation, expected in samples:
                  counts = review.Counter()
                  actual = review.source_aware_terminology("Global.txt", source, translation, counts)
                  self.assertEqual(actual, expected)

              counts = review.Counter()
              item = review.source_aware_terminology("items.txt", "+20 Luck; luck of the devil", "운 +20, 악마의 행운", counts)
              self.assertEqual(item, "운 +20, 악마의 행운")

          '''
          if 'test_source_aware_stat_terms_survive_upstream_variants' not in test:
              if test_anchor not in test:
                  raise SystemExit('test insertion anchor not found')
              test = test.replace(test_anchor, addition + test_anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          python3 -m json.tool korean/translations/stats_skills_reviewed.json >/dev/null
          python3 korean/tools/test_deep_review_corrections.py -v
          python3 -m py_compile korean/tools/apply_deep_review_corrections.py
          git diff --check

      - name: Commit source-aware normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            korean/tools/apply_deep_review_corrections.py \
            korean/tools/test_deep_review_corrections.py \
            korean/translations/stats_skills_reviewed.json
          git commit -m "Normalize Korean terms from source semantics"
          git push origin HEAD:korean-localization
