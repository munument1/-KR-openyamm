name: Temporary validate MMMerge 1.0.16a feedback

on:
  push:
    branches:
      - tmp-mmmerge-116a-feedback
    paths:
      - .github/workflows/tmp-validate-mmmerge-116a.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate MMMerge 1.0.16a feedback patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-mmmerge-116a-feedback
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /korean/**
            /game/items/ItemEnchantRuntime.cpp
      - name: Run feedback and target-name tests
        run: |
          python3 -m py_compile korean/tools/apply_mmmerge_116a_feedback.py korean/tools/sync_map_target_names.py
          python3 -m unittest korean.tools.test_mmmerge_116a_feedback korean.tools.test_sync_map_target_names -v
          python3 - <<'PY'
          from pathlib import Path
          source = Path('game/items/ItemEnchantRuntime.cpp').read_text(encoding='utf-8')
          start = source.index('        case 1318:')
          end = source.index('            break;', start)
          block = source[start:end]
          assert 'addSkillBonus(member, "Stealing", 5);' in block
          assert 'addSkillBonus(member, "Unarmed", 5);' not in block
          assert 'member.waterWalking = true;' in block
          PY
