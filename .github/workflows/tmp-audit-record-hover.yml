name: Temporary record and hover localization audit

on:
  push:
    branches: [tmp-record-hover-fixes]
    paths: [".github/workflows/tmp-audit-record-hover.yml"]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit record text and hover localization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-record-hover-fixes
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/ui/**
            /game/gameplay/**
            /game/outdoor/**
            /game/tables/**
            /korean/**
            /assets_dev/engine/data_tables/decoration_data.txt
            /assets_dev/engine/data_tables/house_data.txt
            /assets_dev/engine/data_tables/map_stats.txt
            /assets_dev/engine/ui/**
            /assets_dev/worlds/mm6/events/maps/**
            /assets_dev/worlds/mm7/events/maps/**
            /assets_dev/worlds/mm8/events/maps/**
            /assets_dev/worlds/mmmerge/events/maps/**
      - name: Locate record rendering and hover display paths
        shell: bash
        run: |
          set -euo pipefail
          echo '===== RECORD / JOURNAL SYMBOLS ====='
          grep -RInE --include='*.cpp' --include='*.h' --include='*.json' --include='*.txt' \
            'History|history|Quest|quest|Autonote|autonote|Journal|journal|Record|record|Awards|awards' \
            game/ui game/gameplay assets_dev/engine/ui 2>/dev/null | head -n 1800 || true
          echo '===== TEXT SHADOW / TEXT RENDER CALLS ====='
          grep -RInE --include='*.cpp' --include='*.h' \
            'shadowTextureHandle|renderHudFontLayerFn|renderLayoutLabel|renderHudText|fontName|labelText' \
            game/ui game/gameplay | head -n 1800 || true
          echo '===== HOVER / STATUS / TARGET DISPLAY PATHS ====='
          grep -RInE --include='*.cpp' --include='*.h' \
            'Hover|hover|statusText|StatusText|displayName|targetName|eventTarget|decoration' \
            game/gameplay game/outdoor game/ui | head -n 2200 || true
          echo '===== DECORATION COVERAGE ====='
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          data = Path('assets_dev/engine/data_tables/decoration_data.txt')
          rows = list(csv.reader(data.read_text(encoding='utf-8-sig').splitlines(), delimiter='\t'))
          payload = json.loads(Path('korean/translations/decoration_hints.json').read_text(encoding='utf-8'))
          mapped = {str(k).strip().casefold() for k in payload.get('entries', {})}
          excluded = {str(x).strip().casefold() for x in payload.get('excluded_sources', [])}
          source = sorted({r[2].strip() for r in rows if len(r) >= 3 and r[0].strip().isdigit() and r[2].strip()}, key=str.casefold)
          unknown = [x for x in source if x.casefold() not in mapped and x.casefold() not in excluded]
          print('unique hints=', len(source), 'mapped=', len(mapped), 'excluded=', len(excluded), 'unknown=', len(unknown))
          for x in unknown: print('UNKNOWN_DECORATION', x)
          for key in ('keg','anvil','tree','rock','flowers','flower'):
              print('CHECK_DECORATION', key, payload.get('entries', {}).get(key))
          PY
