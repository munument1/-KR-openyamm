screen: QuickReference

elements:
  - id: QuickReferenceRoot
    anchor: center
    width: 640
    height: 480
    z_index: 440
    visible: true
    scale:
      min: 1.0
      max: 3.0
    children:
      - id: QuickReferenceBackground
        anchor: top_left
        offset_x: 8
        offset_y: 8
        width: 640
        height: 367
        z_index: 0
        asset:
          default: quikref

      - id: QuickReferenceExitButton
        anchor: top_left
        offset_x: 391
        offset_y: 316
        width: 75
        height: 33
        z_index: 20
        interactive: true
        asset:
          default: but24u
          highlighted: but24h
          pressed: but24d

      - id: QuickReferenceNameLabel
        anchor: top_left
        offset_x: 22
        offset_y: 18
        width: 60
        height: 13
        z_index: 10
        text:
          value: "Name"
          font: Arrus
          color: white
          align_x: left
          align_y: top

